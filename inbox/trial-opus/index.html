<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Rood of Grace</title>
<style>
  :root { --paper:#ece4d2; --ink:#1d1a16; --dim:#7a7064; --red:#8f1d14; --rule:#b9ab92; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); }
  body { font-family: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
         display:flex; flex-direction:column; align-items:center; overflow:hidden; }
  #street { width:100%; max-width:760px; padding:22px 28px 10px; display:flex; align-items:center; gap:0; }
  .stn { flex:1; text-align:center; font-size:12px; letter-spacing:.12em; color:var(--dim); position:relative; }
  .stn .dot { display:block; width:9px; height:9px; margin:0 auto 6px; border:1px solid var(--dim); border-radius:50%; background:transparent; }
  .stn.done .dot { background:var(--dim); }
  .stn.here { color:var(--red); }
  .stn.here .dot { background:var(--red); border-color:var(--red); }
  .stn:not(:last-child)::after { content:""; position:absolute; top:4px; left:calc(50% + 8px); right:calc(-50% + 8px); border-top:1px solid var(--rule); }
  #main { flex:1; width:100%; max-width:760px; overflow-y:auto; padding:8px 28px 20px; }
  #main::-webkit-scrollbar { width:6px; } #main::-webkit-scrollbar-thumb { background:var(--rule); }
  h1 { font-weight:normal; font-size:15px; letter-spacing:.28em; text-transform:uppercase; color:var(--red); margin:18px 0 2px; }
  h2 { font-weight:normal; font-style:italic; font-size:24px; margin:0 0 18px; }
  p { font-size:19px; line-height:1.55; margin:0 0 14px; }
  p.q { padding-left:22px; border-left:2px solid var(--rule); }
  p.ins { font-variant:small-caps; letter-spacing:.06em; text-align:center; border:1px solid var(--rule); padding:12px; }
  em.red, .red { color:var(--red); font-style:normal; }
  #choices { margin-top:22px; display:flex; flex-direction:column; gap:8px; }
  button.c { font:inherit; font-size:18px; text-align:left; background:transparent; color:var(--ink);
             border:none; border-top:1px solid var(--rule); padding:10px 4px; cursor:pointer; }
  button.c:last-child { border-bottom:1px solid var(--rule); }
  button.c:hover, button.c:focus { color:var(--red); outline:none; background:rgba(143,29,20,.04); }
  button.c .k { display:inline-block; width:28px; color:var(--dim); font-size:14px; }
  button.c.off { color:var(--dim); cursor:default; text-decoration:line-through; }
  #foot { width:100%; max-width:760px; padding:10px 28px 18px; border-top:1px solid var(--rule);
          display:flex; justify-content:space-between; font-size:14px; color:var(--dim); gap:20px; }
  #temper span { display:inline-block; width:14px; height:8px; margin-left:3px; border:1px solid var(--dim); vertical-align:middle; }
  #temper span.on { background:var(--red); border-color:var(--red); }
  .fade { animation:f .5s ease; } @keyframes f { from { opacity:0; transform:translateY(4px);} to {opacity:1; transform:none;} }
</style>
</head>
<body>
<div id="street"></div>
<div id="main"><div id="page"></div></div>
<div id="foot"><div id="carry">Carried: nothing</div><div id="purse"></div><div id="temper">Temper</div></div>

<script>
const B = () => window.branches;
const S = {
  st: 0, temper: 1, pence: 6,
  parts: {}, // crank, drum, cistern, wires, bellows, face
  agnes: false, inscription: false, faceDrowned: false, pargeterHeard: false,
  wiresMended: false, built: [], ending: null
};
const NAMES = { crank:"the iron crank", drum:"the pinned drum", cistern:"the tin cistern", wires:"the brass wires", bellows:"the little bellows", face:"the oak face", flask:"Agnes's flask" };
const STATIONS = ["I","II","III","IV","V","VI","VII"];
const STNAMES = ["Market Cross","Star Inn","Conduit","Shambles","Smithy","Bridge","Bench"];
const carriedIn = (B()?.carried || []).filter(Boolean);

function temper(n){ S.temper = Math.max(0, Math.min(5, S.temper + n)); }
function got(k){ S.parts[k] = true; }
function has(k){ return !!S.parts[k]; }
function hot(){ return S.temper >= 4; }

/* ------------------------------------------------------------ scenes */
const SC = {

intro: { st:-1, h:"Maidstone, Candlemas Eve, 1538", sub:"Thomas Gale, clockmaker, of Week Street",
  body: () => `
  <p>This morning the King's commissioner carried the Rood of Grace down from Boxley Abbey to the market cross, opened the back of it before the whole town, and showed them the wires.</p>
  <p>The crucified figure that rolled its eyes and moved its lips and wept for pilgrims had a crank in it. A drum with pins. A pair of bellows. A tin cup of water behind the eyes.</p>
  <p>The crowd pulled it to pieces the way boys pull a goose at a fair. The pieces went down the High Street in a dozen hands. The commissioner, from the scaffold, said that <em>the name of the cunning man who made the works is not known.</em></p>
  <p>It is known to you. Nineteen years ago the old abbot paid you four marks to build them, <span class="red">for the children’s play at Candlemas, to teach the little ones the Passion</span>. You never saw it again. You heard, later, that grown women crawled to it on their knees from Rye. You did not go and look. You told yourself it was not your business.</p>
  <p>You are so angry your teeth hurt. You could not say at whom.</p>
  ${carriedIn.length ? `<p class="q">In your apron pocket, from somewhere you do not remember: ${carriedIn.join(", ")}.</p>` : ""}
  <p>You will walk the street from the cross to the bridge and take back every piece of it. Then you will go home to your bench and put it together, once, properly, so that somebody sees what it was.</p>`,
  ch: () => [{ t:"Go to the market cross.", go:"s1" }]
},

/* I ------------------------------------------------------------- */
s1: { st:0, h:"Station I", sub:"The Rood is condemned",
  body: () => `
  <p>The scaffold at the market cross is empty except for straw and a clerk. Master Pargeter, the commissioner’s man, is writing his report on his knee. A wet wind keeps lifting the page.</p>
  <p>Sticking out of his satchel is an iron crank, the size of a coffin handle, polished bright on the grip where a monk’s hand turned it for nineteen years. You forged that grip. You know the little flaw in the iron near the elbow.</p>
  <p class="q">“Evidence,” says Pargeter, seeing you look. “For his Lordship. Move along.”</p>`,
  ch: () => [
    { t:"Offer him tuppence for it: “for the iron’s worth.”", go:"s1buy", fx:()=>{} },
    { t:"Tell him plainly: “I made that. I made all of it.”", go:"s1truth", fx:()=>temper(1) },
    { t:"Wait until the wind takes his page, then take the crank.", go:"s1steal", fx:()=>temper(1) }
  ]},
s1buy: { st:0, h:"Station I", sub:"The Rood is condemned",
  body: () => `
  <p>Pargeter looks at the two pennies, and at the crank, and at the crowd thinning away into the alehouses.</p>
  <p class="q">“His Lordship has seen it turned. He will not ask to see it twice.” The pennies go into his sleeve. The crank comes out of the satchel. “You never had it from me.”</p>
  <p>It is heavier than you remember. Or your arms are older.</p>`,
  ch: () => [{ t:"Go down to the Star Inn yard, where the shouting is.", go:"s2", fx:()=>{ S.pence-=2; got("crank"); } }]},
s1truth: { st:0, h:"Station I", sub:"The Rood is condemned",
  body: () => `
  <p>Pargeter puts his pen down. For a moment he looks frightened, then interested, which is worse.</p>
  <p class="q">“Then you are party to a fraud upon the King’s subjects.”</p>
  <p class="q">“I made a toy for children. The monks made the fraud.”</p>
  <p class="q">“Show me, then. How the eyes went.” He holds out the crank. Like a boy.</p>
  <p>You show him: turn here, and the drum turns, and the pins lift the levers, and the wires pull. He writes very fast. When you read over his shoulder, it says: <em>a cunning engine of the monks’ own devising.</em></p>
  <p class="q">“Write that a clockmaker made it. For children.”</p>
  <p class="q">“That is not,” says Pargeter, kindly, “what his Lordship needs.” He lets you keep the crank. He thinks it is a kindness.</p>`,
  ch: () => [{ t:"Take the crank. Go down to the Star Inn yard.", go:"s2", fx:()=>{ got("crank"); S.pargeterHeard=true; temper(1); } }]},
s1steal: { st:0, h:"Station I", sub:"The Rood is condemned",
  body: () => `
  <p>You wait. The wind comes, as it does off the Medway, and the page goes cartwheeling along the cobbles with Pargeter after it, shouting <em>Stop that, it is the King’s.</em></p>
  <p>You have the crank under your coat before he catches it. Your heart is going like a smith’s hammer. It is the first thing you have stolen in your life. It was yours.</p>`,
  ch: () => [{ t:"Walk, do not run, to the Star Inn yard.", go:"s2", fx:()=>{ got("crank"); } }]},

/* II ------------------------------------------------------------ */
s2: { st:1, h:"Station II", sub:"The Rood falls the first time",
  body: () => `
  <p>In the Star Inn yard the apprentices are playing football with the drum.</p>
  <p>It is a barrel of beechwood as long as your forearm, set all over with brass pins in spirals, and it rolls badly, which they find hilarious. Each time it hits the wall the pins ring. Two are already bent flat. One boy has a bloody shin from it and is the proudest of them all.</p>
  <p class="q">“Monk’s guts!” one shouts, and boots it into the horse trough.</p>`,
  ch: () => [
    { t:"Roar at them.", go:"s2roar", fx:()=>temper(1) },
    { t:"Offer the tallest boy a penny for it.", go:"s2buy", off:()=>S.pence<1 },
    { t:"Ask them if they want to hear what it plays.", go:"s2play" }
  ]},
s2roar: { st:1, h:"Station II", sub:"The Rood falls the first time",
  body: () => `
  <p>The noise that comes out of you surprises everyone, you most. It is not a word. The boys scatter like starlings and leave the drum in the trough, nosing the green water.</p>
  <p>You fish it out. Your sleeve is soaked to the shoulder. The ostler watches you from the stable door as if you were the one who had done something shameful.</p>`,
  ch: () => [{ t:"Look the drum over.", go:"s2in", fx:()=>got("drum") }]},
s2buy: { st:1, h:"Station II", sub:"The Rood falls the first time",
  body: () => `
  <p class="q">“A penny? For monk’s guts?” The tall boy looks at his friends to see if this is a good price. It is, apparently. He fetches it out of the trough himself and wipes it on his jerkin, with a care that surprises him.</p>`,
  ch: () => [{ t:"Look the drum over.", go:"s2in", fx:()=>{ S.pence-=1; got("drum"); } }]},
s2play: { st:1, h:"Station II", sub:"The Rood falls the first time",
  body: () => `
  <p>That stops them. You take the drum out of the trough, set it on the mounting block, and run your thumbnail along the pins, slowly, the way the crank would.</p>
  <p>Tick. Tick-tick. Tick. A pause. Tick-tick-tick-tick, a long run, then nothing for a full turn, then three. The boys lean in.</p>
  <p class="q">“That one’s the eyes,” you say. “Left, right, left. That long one is the sigh. That gap is where it waits, so you think it’s dead. And these three—”</p>
  <p class="q">“The tears,” says the boy with the shin, very quietly.</p>
  <p>They let you take it. One of them follows you to the gate.</p>`,
  ch: () => [{ t:"Look the drum over.", go:"s2in", fx:()=>got("drum") }]},
s2in: { st:1, h:"Station II", sub:"The Rood falls the first time",
  body: () => `
  <p>The arbor hole runs right through the middle. You squint down it, the way you would check any old work for worm, and see scratches on the inside of the wood. Letters. Your own hand, young and showing off.</p>
  <p class="ins">Made by T. Gale of Maidstone for the children of Boxley at Candlemas · It is beech and brass · Do not kneel to it<br><br>Heart first · Hand to heart · Eyes from heart · Breath from heart · Tears last, or they rust the heart</p>
  <p>You had forgotten. The monks never once took the drum off its arbor. In nineteen years nobody looked inside it. They could have read it any day. <span class="red">Do not kneel to it.</span></p>`,
  ch: () => [{ t:"Go on down to the conduit.", go:"s3", fx:()=>{ S.inscription=true; temper(1); } }]},

/* III ----------------------------------------------------------- */
s3: { st:2, h:"Station III", sub:"The Rood meets the women of Jerusalem",
  body: () => `
  <p>At the conduit a woman in a travelling cloak is sitting on the stone step with something in her lap. A little tin cistern, dented, with a pinhole spout on each side. It still drips.</p>
  <p>Her name, when you ask, is Agnes Hollis, widow, of Rye. In the year 1527 she came here on her knees, the last mile, and gave the abbey her wedding ring, and the Rood wept for her son. She has walked from Rye again today because she heard they were taking it down. She wanted to see.</p>
  <p class="q">“I saw,” she says. “It was a cup of water.” She does not look up. “Go on, then. Laugh. Everybody else has.”</p>`,
  ch: () => [
    { t:"Offer to buy the cistern from her.", go:"s3buy" },
    { t:"Tell her you are gathering the pieces for the burning.", go:"s3lie", fx:()=>temper(1) },
    { t:"Tell her who you are.", go:"s3truth" }
  ]},
s3buy: { st:2, h:"Station III", sub:"The Rood meets the women of Jerusalem",
  body: () => `
  <p>She looks at your hand, at the pennies in it, for long enough that you close it.</p>
  <p class="q">“I have paid for this already. A gold ring, and the walk. Who are you, that you want it so badly?”</p>`,
  ch: () => [
    { t:"Tell her you are gathering the pieces for the burning.", go:"s3lie", fx:()=>temper(1) },
    { t:"Tell her who you are.", go:"s3truth" }
  ]},
s3lie: { st:2, h:"Station III", sub:"The Rood meets the women of Jerusalem",
  body: () => `
  <p>She stands up and throws the cistern at your chest, hard. It is surprisingly heavy for tin. You catch it against your coat and the last of its water soaks through to your shirt.</p>
  <p class="q">“Burn it, then. Burn all of it. And the monks in it.”</p>
  <p>She walks off up the street toward the Rye road. You stand there wet with her tears, or the abbey’s, or the well’s, which is to say nobody’s, and you have the cistern, and you feel like a thief for the second time today.</p>`,
  ch: () => [{ t:"Go on to the Shambles.", go:"s4", fx:()=>got("cistern") }]},
s3truth: { st:2, h:"Station III", sub:"The Rood meets the women of Jerusalem",
  body: () => `
  <p class="q">“I made it. The works. I made them for children. For a play. I never—” and here you find you cannot finish, because the rage has come up into your throat and turned into something else halfway.</p>
  <p>Agnes Hollis looks at you for the first time. Then she slaps you across the face, quite precisely, as if it were a task she had been saving.</p>
  <p class="q">“There,” she says. “That is for my ring.” She holds out the cistern. “And this is because I want to see it. Not from the back of a crowd. I want to see how a man made a thing that cried for my boy. Will you show me?”</p>`,
  ch: () => [{ t:"“Come to Week Street at dusk. The bench under the sign of the dial.”", go:"s4", fx:()=>{ got("cistern"); S.agnes=true; temper(-1); } }]},

/* IV ------------------------------------------------------------ */
s4: { st:3, h:"Station IV", sub:"The Rood is stripped of its garments",
  body: () => `
  <p>By the butchers’ stalls of the Shambles a pedlar called Nick Ferris has a tray around his neck. On the tray, in neat lengths, are the brass wires that ran from the drum to the eyes and lips. He has cut them with snips into pieces as long as a finger.</p>
  <p class="q">“The very strings the monks did pull! The Devil’s own puppet-thread! A farthing the length, carry home a piece of Popery and spit on it of an evening!”</p>
  <p>He has sold two already. There are nine left on the tray. You need every one, or the eyes will only go one way.</p>`,
  ch: () => [
    { t:`Buy all nine. (Nine farthings: you have ${S.pence}d.)`, go:"s4buy", off:()=>S.pence<3 },
    { t:"Tell the crowd he is selling them trash.", go:"s4shout", fx:()=>temper(1) },
    { t:"Take a length, and show the buyers what it actually did.", go:"s4show" }
  ]},
s4buy: { st:3, h:"Station IV", sub:"The Rood is stripped of its garments",
  body: () => `
  <p>Ferris counts the coins twice, delighted, and tips the whole tray into your hands. You give him threepence and do not wait for the farthing.</p>
  <p class="q">“Going to spit on them all, master? A man after my own heart.”</p>
  <p>The two lengths already sold are gone up the street in somebody’s purse. You will have to draw new wire at the bench for those. That is all right. Wire you can make.</p>`,
  ch: () => [{ t:"Go on to the smithy.", go:"s5", fx:()=>{ S.pence-=3; got("wires"); } }]},
s4shout: { st:3, h:"Station IV", sub:"The Rood is stripped of its garments",
  body: () => `
  <p class="q">“Trash! It’s brass wire from a clockmaker’s, there’s ten yards of it in my shop at a penny the yard—”</p>
  <p>That was a mistake. The crowd looks from you to the pedlar and decides you are the more interesting of the two. <em>How do you know what wire it is?</em> someone asks, and then several people ask it.</p>
  <p>Ferris, a professional, sees which way the wind is going, sweeps his tray into his coat and vanishes between two carcasses. In the scuffle somebody drops the lengths in the gutter. You pick them out of the blood and sawdust on your knees while a butcher’s boy watches.</p>
  <p>On your knees. Well.</p>`,
  ch: () => [{ t:"Go on to the smithy.", go:"s5", fx:()=>got("wires") }]},
s4show: { st:3, h:"Station IV", sub:"The Rood is stripped of its garments",
  body: () => `
  <p>You take a length off the tray, which makes Ferris squawk, and bend one end into a hook around your finger and the other around a stall-post.</p>
  <p class="q">“Pull this end and the eye goes left. Let go and the spring brings it back. That’s all it ever was. There’s nothing in the wire. It’s wire.”</p>
  <p>The buyers look at it. Wire. They look at Ferris. Their interest goes out of the tray like heat out of a horseshoe. Ferris, sour, sells you the lot for a penny, just to be rid of it.</p>
  <p class="q">“You’ve no feeling for trade,” he tells you.</p>`,
  ch: () => [{ t:"Go on to the smithy.", go:"s5", fx:()=>{ S.pence=Math.max(0,S.pence-1); got("wires"); } }]},

/* V ------------------------------------------------------------- */
s5: { st:4, h:"Station V", sub:"The Rood is nailed",
  body: () => `
  <p>Jem Rowe’s smithy at the foot of Gabriel’s Hill is hot as a mouth. Jem is a great reader of the new English Bible, and a great hater of images, and he has the little bellows.</p>
  <p>The lungs of the Rood: two boards of pear wood and a calf’s-leather fold, no bigger than a psalter. They made the sigh. He has already nailed it to the bench by his small hearth and is using it to bring up a fine heat for rivets.</p>
  <p class="q">“Idolatry,” says Jem, pumping, “is better put to honest use.”</p>`,
  ch: () => [
    { t:"Argue Scripture with him.", go:"s5argue", fx:()=>temper(1) },
    { t:"Offer to mend the cracked nozzle on his big bellows in exchange.", go:"s5mend" },
    { t:"“It’s a bellows, Jem. It was never anything but a bellows.”", go:"s5plain" }
  ]},
s5argue: { st:4, h:"Station V", sub:"The Rood is nailed",
  body: () => `
  <p>You quote him Exodus; he quotes you Isaiah, who has more to say about carpenters. You quote him the abbot’s promise about the children; he says the Pope is the Antichrist; you say you never said otherwise, you made a <em>toy</em>, Jem; he pumps harder at every word and the little bellows wheezes and wheezes like an old man being argued at.</p>
  <p>At last he stops, chest heaving, and the bellows stops with him.</p>
  <p class="q">“You made it,” he says. “Then take your idol. I’ll not have it sighing at me.” He prises it off with the claw of a hammer. The nail holes go right through the leather.</p>`,
  ch: () => [{ t:"Go down to the bridge.", go:"s6", fx:()=>got("bellows") }]},
s5mend: { st:4, h:"Station V", sub:"The Rood is nailed",
  body: () => `
  <p>Jem’s big forge bellows has a split in the iron nozzle that he has been binding with wet rawhide since Michaelmas. You know exactly what is wrong with it, which is a relief: something in this day you know exactly what is wrong with.</p>
  <p>It takes the better part of an hour. Neither of you talks about God. When it is done the fire roars up white, and Jem laughs out loud like a boy, and prises the little bellows off his bench with the claw of a hammer and gives it to you.</p>
  <p class="q">“It wheezes,” he says, almost apologetic.</p>
  <p class="q">“It always did. That was the sigh.”</p>`,
  ch: () => [{ t:"Go down to the bridge.", go:"s6", fx:()=>{ got("bellows"); temper(-1); } }]},
s5plain: { st:4, h:"Station V", sub:"The Rood is nailed",
  body: () => `
  <p>Jem stops pumping.</p>
  <p class="q">“Pear wood,” you say. “Calf leather. Two brass hinges, I bought them off a Fleming. It can no more be an idol than your boots can. The idolatry was in the people who told women to crawl to it. Not in this.”</p>
  <p>He looks down at it a long while. Then he takes the claw of his hammer and gently, gently, as though it might be hurt, draws the nails.</p>
  <p class="q">“Then it’s yours,” he says, “and the sin is theirs. And God help them.”</p>`,
  ch: () => [{ t:"Go down to the bridge.", go:"s6", fx:()=>got("bellows") }]},

/* VI ------------------------------------------------------------ */
s6: { st:5, h:"Station VI", sub:"Veronica wipes the face",
  body: () => `
  <p>At the foot of Maidstone bridge the commissioner’s carters are loading the body of the Rood onto a wagon for London. It is to be shown again at Paul’s Cross on Sunday, preached over by a bishop, and burned. It lies on its back on the cart, hollow, open as a gutted fish. It has no head.</p>
  <p>The head is lying in the mud by the wheel, where somebody kicked it. Oak, painted, the eyes gouged out with a knife so that two holes look at the sky. The holes are where the wires went. Whoever gouged them was looking for something behind the eyes and found nothing, which is correct.</p>
  <p>A carter sees you looking. <span class="q">“Take it if you want it. London only wants the body. It burns better.”</span></p>
  <p>The river is high and brown and going fast.</p>`,
  ch: () => [
    { t:"Pick the face out of the mud and wipe it with your sleeve.", go:"s6take" },
    { t:"Throw it in the Medway yourself. Let that be the end of the face.", go:"s6drown", fx:()=>temper(1) }
  ]},
s6take: { st:5, h:"Station VI", sub:"Veronica wipes the face",
  body: () => `
  <p>You crouch and lift it. The mud comes off in one wipe, mostly. Under it the paint is better than you expected, the abbey’s painter knew his work: a tired man’s face, not beautiful, a little surprised.</p>
  <p>You did not make the face. You only ever made what went behind it. You had never seen it until now.</p>
  <p class="q">“Friend of yours?” says the carter.</p>`,
  ch: () => [{ t:"Carry it home up the hill to Week Street.", go:"s7", fx:()=>got("face") }]},
s6drown: { st:5, h:"Station VI", sub:"Veronica wipes the face",
  body: () => `
  <p>You pick it up by the hair and throw it off the bridge end as far as you can, which is not far. It turns over once in the air, and you see it is a tired man’s face, not beautiful, a little surprised, and then the brown water has it and it is going down toward Rochester faster than a man can walk.</p>
  <p>The carters cheer. You did not do it for them.</p>
  <p>You will build without a face, then. The works will have to look at whoever comes as they are: brass and beech and wire. Nothing to kneel to.</p>`,
  ch: () => [{ t:"Go home up the hill to Week Street.", go:"s7", fx:()=>{ S.faceDrowned=true; } }]},

/* VII ----------------------------------------------------------- */
s7: { st:6, h:"Station VII", sub:"The Rood is laid in the tomb",
  body: () => `
  <p>Your shop under the sign of the dial. The fire is low. The clocks you are mending for other people go on ticking, out of step with one another, unbothered.</p>
  <p>You clear the bench with your forearm and lay it all out: ${partsList()}. You set up an oak post in the vice for a frame.</p>
  <p>${hot() ? "Your hands are shaking. You are still so angry. You make yourself put them flat on the bench until they stop." : "Your hands are steady. They know this work better than you know anything today."}</p>
  <p>Through the arbor hole, upside down from this side, you can read your own young scratching: <em>Heart first.</em></p>`,
  ch: () => [{ t:"Begin.", go:"build" }]},

build: { st:6, h:"Station VII", sub:"The Rood is laid in the tomb",
  body: () => {
    const lines = S.built.map(k => `<p>${BUILT_TEXT[k]()}</p>`).join("");
    const last = S.lastWrong ? `<p class="q">${S.lastWrong}</p>` : "";
    return (lines || `<p>Which piece goes on first?</p>`) + last + (S.built.length && S.built.length < 5 ? `<p><em>Next?</em></p>` : "");
  },
  ch: () => {
    const order = ["drum","crank","wires","bellows","cistern"];
    return order.filter(k => !S.built.includes(k)).map(k => ({
      t: "Fit " + NAMES[k] + ".", go: null, fx: () => fit(k)
    }));
  }},

turn: { st:6, h:"Station VII", sub:"The Rood is laid in the tomb",
  body: () => `
  <p>It stands on the bench: ${S.faceDrowned ? "an oak post with a beech drum in its belly, two brass eyelets at the top where eyes would be, and nothing pretending to be anything" : "an oak post, a tired painted face at the top of it, and the works showing honestly behind, because you have not put the back on and you are not going to"}.</p>
  <p>You put your hand on the crank. Your own grip. The flaw near the elbow.</p>`,
  ch: () => [{ t:"Turn it.", go:"turned" }]},

turned: { st:6, h:"Station VII", sub:"The Rood is laid in the tomb",
  body: () => `
  <p>The drum turns. The pins come round, tick, tick-tick, and lift their levers, and the wires draw. ${S.faceDrowned ? "The two brass eyelets swing left, right, left, and the right one sticks a little, as it always did." : "The eyes in the gouged sockets — you have set two brass buttons there — swing left, right, left, and the right one sticks a little, as it always did."}</p>
  <p>The long run of pins: the bellows lifts, the leather breathes, and from the post comes a sigh, wheezy through Jem’s nail holes, so human that you take your hand off the crank.</p>
  <p>The gap, where it waits, so you think it’s dead.</p>
  <p>Then the three pins. The tear-valves open. And nothing comes out, because the cistern is empty. Of course it is. It only ever wept what somebody poured into it.</p>
  ${S.agnes ? `<p>There is a knock at the door. It is dusk. It is Agnes Hollis, widow, of Rye.</p>` : `<p>It is dusk. Nobody is coming. The clocks tick.</p>`}`,
  ch: () => S.agnes ? [{ t:"Let her in.", go:"agnes" }] : [{ t:"Fill the cistern from the jug yourself.", go:"alone" }]
},

agnes: { st:6, h:"Station VII", sub:"The Rood is laid in the tomb",
  body: () => `
  <p>She stands in front of it for a long time without saying anything. She looks at the drum. She reads, upside down through the arbor hole, what you scratched there, moving her lips. <em>Do not kneel to it.</em></p>
  <p>Then she takes from her cloak a little leather flask.</p>
  <p class="q">“Holy water,” she says. “From the abbey stoup. I filled it in twenty-seven, the day I came on my knees. I have kept it eleven years, against the day I needed it.” She pulls the stopper with her teeth. “I think it is today. Show me where.”</p>
  <p>You show her. She pours it into the tin cistern behind the eyes, every drop. You turn the crank.</p>
  <p>Tick. Tick-tick. Left, right, left. The sigh. The wait. Three pins.</p>
  <p>It weeps. Two clean little runnels down from the brass eyes, her own water, eleven years kept, coming back to her exactly as she gave it. Not one drop more.</p>
  <p>Agnes Hollis begins to laugh. It is a terrible laugh at first, and then it isn’t. She laughs until she has to sit down on your stool, and wipe her eyes, and she says: <span class="q">“Oh, it’s <em>mine</em>. It was always mine. The silly thing. It never had a drop of its own.”</span></p>
  <p>You find your rage has gone somewhere. Not away. It is sitting in you like a weight in a clock, which is to say it has become the thing that makes the rest go.</p>`,
  ch: () => endChoices()
},
alone: { st:6, h:"Station VII", sub:"The Rood is laid in the tomb",
  body: () => `
  <p>You fill the tin cistern from the water jug, the ordinary water you wash your hands in, and turn the crank.</p>
  <p>Tick. Tick-tick. Left, right, left. The sigh. The wait. Three pins.</p>
  <p>It weeps. Two clean runnels down from the brass, exactly as much as you gave it. Not one drop more. Nineteen years of pilgrims, and it only ever gave them back their own water.</p>
  <p>You sit on your stool and watch it, and after a while you find you are crying too, which is absurd, a grown man crying at a toy. Then you think: that was the trick, and it was never in the toy.</p>
  <p>You find your rage has gone somewhere. Not away. It is sitting in you like a weight in a clock, which is to say it has become the thing that makes the rest go.</p>`,
  ch: () => endChoices()
},

end: { st:7, h:"Candlemas, 1538", sub:"",
  body: () => ENDINGS[S.ending]() + `
  <p style="margin-top:28px;color:var(--dim);font-size:16px">The street is done. Somewhere further in, the house goes on.</p>`,
  ch: () => [
    { t:"Go onward.", go:null, fx:()=>{ doCarry(); B()?.onward?.(); } },
    { t:"Turn the crank once more.", go:null, fx:()=>{ B()?.say?.("Tick. Tick-tick. Left, right, left. The sigh."); } }
  ]}
};

/* ------------------------------------------------------------ building */
const BUILT_TEXT = {
  drum:   () => `The drum goes onto the arbor in the oak post, pins outward. Heart first. ${S.inscription ? "The scratched words face inward again, where nobody will read them." : ""} You straighten the two bent pins with pliers; one of them never quite comes true.`,
  crank:  () => `The crank goes onto the arbor’s square end. Hand to heart. You give it a quarter turn and the drum turns with it, and the pins go by your ear: tick, tick-tick.`,
  wires:  () => `${hot() && !S.wiresMended ? "The first splice slips; you swear, and do it again slower. " : ""}You splice the cut lengths with fine twisted joints, draw two new ones on the plate for the lengths that went home in strangers’ purses, and run them from the drum’s levers up to ${S.faceDrowned ? "two brass eyelets you have bent at the top of the post" : "the face, through the gouged sockets, to two brass buttons for eyes"}. Eyes from heart.`,
  bellows:() => `The little bellows hangs on the drum’s second cam with its nozzle at ${S.faceDrowned ? "the top of the post" : "the parted lips"}. You patch Jem’s nail holes with glue and a scrap of kid, then leave one open. It had a wheeze before. It should keep it. Breath from heart.`,
  cistern:() => `Last, the dented tin cistern, wired above everything, its pinhole spouts at the eyes, its valves on the drum’s last three pins. Tears last, or they rust the heart.`
};
const WRONG = {
  crank:  "You hold the crank against the post. It has nothing to turn. A hand with no heart to turn is a man waving at nothing.",
  wires:  "You hold up the wires. They need levers to hang from, and the levers ride the drum, and the drum needs turning first.",
  bellows:"The bellows wants a cam to lift it. Not yet.",
  cistern:"If you hang the water in first it will drip on everything below while you work. Tears last, or they rust the heart.",
  drum:   ""
};
const ORDER = ["drum","crank","wires","bellows","cistern"];
function fit(k){
  const need = ORDER[S.built.length];
  if (k === need) {
    S.built.push(k); S.lastWrong = null;
    if (S.built.length === 5) { go("turn"); return; }
  } else {
    S.lastWrong = WRONG[k] || "Not yet.";
  }
  go("build");
}
function partsList(){
  const ks = ["crank","drum","wires","bellows","cistern","face"].filter(has).map(k=>NAMES[k]);
  if (S.faceDrowned) ks.push("and no face");
  return ks.join(", ");
}

/* ------------------------------------------------------------ endings */
function endChoices(){
  return [
    { t:"Carry it to the commissioner in the morning and make him write down your name.", go:"end", fx:()=>{ S.ending="name"; } },
    { t:"Take the hammer to it yourself. It is yours to break.", go:"end", fx:()=>{ S.ending="break"; } },
    { t:"Keep it for tomorrow. Candlemas. Let the children of Week Street turn it.", go:"end", fx:()=>{ S.ending="children"; } }
  ];
}
const ENDINGS = {
  name: () => `
  <p>In the morning you carry it down Week Street to the Star, where the commissioner is breakfasting, and set it on his table among the bread.</p>
  <p class="q">“Thomas Gale. Clockmaker. Of this town. Made it in 1519 for the children of Boxley, four marks, and it is beech and brass, and here, my lord, look inside the drum, it says so.”</p>
  <p>${S.pargeterHeard ? "Pargeter, at his elbow, goes quite white, and then, when his lordship nods, writes it down. Your name. In the King’s report. Spelled wrong." : "The commissioner looks at you for a long time, and then at his clerk, who writes it down. Your name. In the King’s report. Spelled wrong."}</p>
  <p>It is a dangerous thing to have done. You are shaking all the way home. You have never been so glad.</p>`,
  break: () => `
  <p>You take the hammer down from the wall. You weigh it. You look at the drum turning, the eyes going left, right, left, the right one sticking.</p>
  <p>Then you break it. Carefully. The way you would take down a clock: each piece off in the order it went on, laid in a row on the bench. Cistern, bellows, wires, crank, drum. Nothing smashed. Nothing that could not go back.</p>
  <p>It turns out that is what you meant by breaking it. That nobody else would ever get to.</p>
  ${S.agnes ? "<p>Agnes watches you do it, and nods, and takes the empty flask home to Rye.</p>" : ""}`,
  children: () => `
  <p>Candlemas morning. You set it in the shop window with the back off and a card in your best hand: <em>TURN IT. IT IS BEECH AND BRASS.</em></p>
  <p>By noon there are eleven children in your shop, including the boy with the bloody shin from the Star yard, who has brought his sister. They take turns on the crank. They argue about whose turn. They make it sigh over and over until it wheezes like Jem Rowe going up Gabriel’s Hill. Nobody kneels. One small girl pours her milk in the cistern to see if it will weep milk. It does.</p>
  <p>Four marks, nineteen years late. It is what it was for.</p>
  ${S.agnes ? "<p>Agnes Hollis stays for the feast, and shows the girl how to fill it properly.</p>" : ""}`
};
function doCarry(){
  const items = ["the pinned drum (it says: Do not kneel to it)"];
  if (S.agnes) items.push("Agnes Hollis's empty flask");
  if (S.faceDrowned) items.push("a wet sleeve, from the river");
  else items.push("the oak face with brass eyes");
  B()?.carry?.(items);
}

/* ------------------------------------------------------------ render */
const $ = id => document.getElementById(id);
let cur = "intro";
function go(id){
  cur = id;
  const sc = SC[id];
  if (sc.st >= 0) S.st = sc.st;
  render();
}
function render(){
  const sc = SC[cur];
  let html = `<div class="fade"><h1>${sc.h}</h1>${sc.sub ? `<h2>${sc.sub}</h2>` : "<h2>&nbsp;</h2>"}${sc.body()}<div id="choices"></div></div>`;
  $("page").innerHTML = html;
  const box = $("choices");
  const chs = sc.ch();
  chs.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "c";
    const off = c.off && c.off();
    if (off) b.classList.add("off");
    b.innerHTML = `<span class="k">${i+1}</span>${c.t}`;
    b.onclick = () => {
      if (off) { B()?.say?.("Your purse is too light for that."); return; }
      if (c.fx) c.fx();
      if (c.go) go(c.go);
      else if (cur !== "end") render();
      hud();
    };
    box.appendChild(b);
  });
  $("main").scrollTop = 0;
  hud();
}
function hud(){
  const sidx = cur === "intro" ? -1 : (cur === "end" ? 7 : S.st);
  $("street").innerHTML = STATIONS.map((r,i)=>`<div class="stn ${i<sidx?'done':''} ${i===sidx?'here':''}"><span class="dot"></span>${r}<br>${STNAMES[i]}</div>`).join("");
  const ks = ["crank","drum","cistern","wires","bellows","face"].filter(has).map(k=>NAMES[k].replace(/^the /,""));
  $("carry").textContent = "Carried: " + (ks.length ? ks.join(", ") : "nothing yet");
  $("purse").textContent = "Purse: " + S.pence + "d";
  $("temper").innerHTML = "Temper" + [0,1,2,3,4].map(i=>`<span class="${i<S.temper?'on':''}"></span>`).join("");
}
window.addEventListener("keydown", e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) {
    const bs = document.querySelectorAll("#choices button.c");
    if (bs[n-1]) { bs[n-1].click(); e.preventDefault(); }
  }
});
try { go("intro"); }
catch (err) { $("page").innerHTML = "<h1>Maidstone, 1538</h1><p>The page tore. (" + err.message + ")</p>"; }
setTimeout(()=>B()?.say?.("Read, then choose. Click a line or press its number."), 800);
</script>
</body>
</html>
