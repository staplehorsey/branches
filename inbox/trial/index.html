<!doctype html><meta charset=utf-8><title>The Patient Garden</title>
<style>html,body{margin:0;height:100%;background:#020503;overflow:hidden}canvas{display:block}</style>
<canvas id=c></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
let sd=7;function R(){sd=(sd*16807)%2147483647;return sd/2147483647}
const S=2600,C=S/2;
const plants=[];for(let i=0;i<1600;i++){plants.push({x:R()*S,y:R()*S,h:20+R()*50,l:3+(R()*5|0),hue:100+R()*60,sw:R()*6,a:R()*6})}
const fl=[];for(let i=0;i<7;i++){const a=i/7*6.283+0.3,r=500+R()*600;fl.push({x:C+Math.cos(a)*r,y:C+Math.sin(a)*r,p:0,done:false,hue:[320,45,190,280,10,150,60][i]})}
const P={x:C,y:C,vx:0,vy:0},keys={};let mouse=null,t=0,doorOpen=false,said={},ac=null,moving=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;boot()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
cv.addEventListener('pointerdown',e=>{mouse=[e.clientX,e.clientY];boot()});
cv.addEventListener('pointermove',e=>{if(mouse)mouse=[e.clientX,e.clientY]});
addEventListener('pointerup',()=>{mouse=null});
function boot(){if(!ac){try{ac=new AudioContext()}catch(e){}}}
function tone(f,d,v){if(!ac)return;try{const o=ac.createOscillator(),gn=ac.createGain();o.frequency.value=f;o.type='sine';gn.gain.setValueAtTime(0,ac.currentTime);gn.gain.linearRampToValueAtTime(v,ac.currentTime+.05);gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(s){try{branches.say(s)}catch(e){}}
const ff=[];for(let i=0;i<30;i++)ff.push({x:C+(R()-.5)*300,y:C+(R()-.5)*300,s:R()*6});
let last=performance.now();
function nearestOpen(x,y){let b=null,bd=1e9;for(const f of fl)if(!f.done){const d=Math.hypot(f.x-x,f.y-y);if(d<bd){bd=d;b=f}}return b}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 let ax=0,ay=0;if(keys.a||keys.arrowleft)ax--;if(keys.d||keys.arrowright)ax++;if(keys.w||keys.arrowup)ay--;if(keys.s||keys.arrowdown)ay++;
 if(mouse){const dx=mouse[0]-W/2,dy=mouse[1]-H/2,d=Math.hypot(dx,dy);if(d>12){ax=dx/d;ay=dy/d}}
 const l=Math.hypot(ax,ay)||1,sp=150,on=(ax||ay)?1:0;
 const k=Math.min(1,dt*6);
 P.vx+=((ax/l)*sp*on-P.vx)*k;P.vy+=((ay/l)*sp*on-P.vy)*k;
 P.x=Math.max(20,Math.min(S-20,P.x+P.vx*dt));P.y=Math.max(20,Math.min(S-20,P.y+P.vy*dt));
 moving=Math.hypot(P.vx,P.vy);
 let bloomed=0;
 for(let i=0;i<fl.length;i++){const f=fl[i];
  const d=Math.hypot(f.x-P.x,f.y-P.y);
  if(!f.done){
   if(d<70&&moving<20)f.p+=dt/24;else if(d<70)f.p+=dt/200;else f.p=Math.max(0,f.p-dt/400);
   if(f.p>=1){f.done=true;f.p=1;tone(220*Math.pow(1.5,i%4)*(i>3?2:1),4,.15);say("it opens.")}
  }
  if(f.done)bloomed++;
 }
 if(t>3&&!said.a){said.a=1;say("It is very dark, and very full. Something here wants you to stop.")}
 if(bloomed>=1&&!said.b){said.b=1;say("Stand beside a bud and do not move.")}
 if(bloomed>=7&&t>=300&&!doorOpen){doorOpen=true;say("A door has grown at the centre.")}
 if(bloomed>=7&&t<300&&!said.c){said.c=1;say("All open. The garden is not finished with you yet.")}
 if(doorOpen&&Math.hypot(P.x-C,P.y-C)<40&&!said.go){said.go=1;try{branches.onward()}catch(e){}}
 g.fillStyle='#030804';g.fillRect(0,0,W,H);
 const cx=W/2-P.x,cy=H/2-P.y;
 g.save();g.translate(cx,cy);
 g.lineWidth=2;
 for(const p of plants){
  if(p.x+cx<-80||p.x+cx>W+80||p.y+cy<-80||p.y+cy>H+80)continue;
  const dl=Math.hypot(p.x-P.x,p.y-P.y);
  const sw=Math.sin(t*.8+p.sw)*5+(dl<60?(p.x-P.x)*.2:0);
  g.strokeStyle='hsl('+p.hue+',45%,'+(14+Math.max(0,28-dl/9))+'%)';
  for(let j=0;j<p.l;j++){const a=-1.57+(j-p.l/2)*.35+p.a*.05;g.beginPath();g.moveTo(p.x,p.y);
   g.quadraticCurveTo(p.x+Math.cos(a)*p.h*.5+sw*.5,p.y+Math.sin(a)*p.h*.6,p.x+Math.cos(a)*p.h*.8+sw,p.y+Math.sin(a)*p.h);g.stroke()}
 }
 for(const f of fl){
  const r=6+f.p*26;
  if(f.done||f.p>0){const rr=r*(f.done?9:4);const gr=g.createRadialGradient(f.x,f.y,0,f.x,f.y,rr);gr.addColorStop(0,'hsla('+f.hue+',90%,70%,'+(.15+f.p*.5)+')');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(f.x,f.y,rr,0,7);g.fill()}
  g.fillStyle='hsl('+f.hue+','+(30+f.p*60)+'%,'+(25+f.p*45)+'%)';
  const n=f.done?9:5;for(let j=0;j<n;j++){const a=j/n*6.283+t*.1;g.beginPath();g.ellipse(f.x+Math.cos(a)*r*.6,f.y+Math.sin(a)*r*.6,r*.5,r*.22,a,0,7);g.fill()}
 }
 if(doorOpen){const gr=g.createRadialGradient(C,C,0,C,C,160);gr.addColorStop(0,'rgba(255,250,220,1)');gr.addColorStop(1,'rgba(255,250,220,0)');g.fillStyle=gr;g.beginPath();g.arc(C,C,160,0,7);g.fill();
  g.fillStyle='#fffbe8';g.beginPath();g.moveTo(C-26,C+30);g.lineTo(C-26,C-10);g.arc(C,C-10,26,Math.PI,0);g.lineTo(C+26,C+30);g.fill()}
 const tg=nearestOpen(P.x,P.y);
 g.fillStyle='#ffe9a0';
 for(const q of ff){
  if(tg){const a=Math.atan2(tg.y-q.y,tg.x-q.x);q.x+=Math.cos(a)*10*dt+Math.sin(t+q.s)*.6;q.y+=Math.sin(a)*10*dt+Math.cos(t*1.3+q.s)*.6}
  else{q.x+=(C-q.x)*dt*.2;q.y+=(C-q.y)*dt*.2}
  if(Math.hypot(q.x-P.x,q.y-P.y)>500){q.x=P.x+(R()-.5)*300;q.y=P.y+(R()-.5)*300}
  g.globalAlpha=.4+.5*Math.sin(t*2+q.s);g.fillRect(q.x,q.y,2.5,2.5)}
 g.globalAlpha=1;
 g.restore();
 const lr=170+bloomed*8+(moving<20?10*Math.sin(t*2):0);
 const m=g.createRadialGradient(W/2,H/2,10,W/2,H/2,lr*2.2);
 m.addColorStop(0,'rgba(2,6,3,0)');m.addColorStop(.35,'rgba(2,6,3,.55)');m.addColorStop(1,'rgba(2,5,3,.97)');
 g.fillStyle=m;g.fillRect(0,0,W,H);
 g.fillStyle='#fff3c0';g.beginPath();g.arc(W/2,H/2,4,0,7);g.fill();
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
