import * as THREE from '/vendor/three.module.js';
import { createSpace } from './kit.js';

const { scene, camera, renderer, player } = s;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI;

/* ---------- overlays ---------- */
const ov = (css, html = '') => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;pointer-events:none;z-index:40;' + css;
  d.innerHTML = html;
  document.body.appendChild(d);
  return d;
};
const fade = ov('inset:0;background:#000;opacity:1;transition:opacity 1.5s;z-index:45');
const fadeText = ov('inset:0;display:flex;align-items:center;justify-content:center;color:#efe6cf;font:italic 34px Georgia,serif;opacity:0;transition:opacity 1s;z-index:46');
const capBox = ov('left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#efe6cf;font:24px/1.5 Georgia,serif;padding:0 12vw;opacity:0;transition:opacity 1.2s;text-shadow:0 2px 8px #000;z-index:44');
const tip = ov('right:14px;bottom:14px;color:#9fb;font:13px Georgia,serif;opacity:.7;text-align:right', 'click to look · WASD to walk · E to use');
setTimeout(() => (tip.style.opacity = 0), 14000);
async function caption(html, ms) {
  capBox.innerHTML = html;
  capBox.style.opacity = 1;
  await sleep(ms);
  capBox.style.opacity = 0;
}

/* ---------- speech queue ---------- */
const sayQ = [];
let sayBusy = false;
function pump() {
  if (sayBusy || !sayQ.length) return;
  sayBusy = true;
  const { t, res } = sayQ.shift();
  s.say(t);
  setTimeout(() => { sayBusy = false; res(); pump(); }, 3400);
}
const say = (t) => new Promise((res) => { sayQ.push({ t, res }); pump(); });
const crew = (t) => { s.say(t); };

/* ---------- state ---------- */
const S = {
  contact: 0, step: 'flying', compared: false, phase: 'loop', second: 'none',
  phoneReady: false, flyOK: false, frozen: false, time: 36 * 60, mult: 1,
  lastAct: performance.now(), holdAt: 0, holdHinted: false, mug: 0, stillTex: null,
  boilerTex: null, doorT: -1, ritual: false, lock: null, strikeT: -1, pinnedCount: [0, 0, 0, 0],
  erupt: false, flick: false, bead: false, cableDone: false,
};
const act = () => (S.lastAct = performance.now());
const hms = (sec) => {
  sec = Math.floor(sec);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(Math.floor(sec / 3600) % 24)}:${p(Math.floor(sec / 60) % 60)}:${p(sec % 60)}`;
};

/* ---------- audio ---------- */
const A = (() => {
  let ctx = null, out = null, seaG = null, humG = null, cheerG = null, nb = null;
  let cheerT = 0, cheerV = 0, seaT = 0, seaV = 0, humT = 1, humV = 1, creakIn = 5;
  function init() {
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; return; }
    try {
      out = ctx.createGain(); out.gain.value = 0.7; out.connect(ctx.destination);
      const n = ctx.sampleRate * 2;
      nb = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = nb.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const loop = () => { const b = ctx.createBufferSource(); b.buffer = nb; b.loop = true; b.start(); return b; };
      humG = ctx.createGain(); humG.gain.value = 0.025; humG.connect(out);
      [60, 120].forEach((f, k) => { const o = ctx.createOscillator(); o.frequency.value = f; const g = ctx.createGain(); g.gain.value = k ? 0.4 : 1; o.connect(g); g.connect(humG); o.start(); });
      const eg = ctx.createGain(); eg.gain.value = 0.1;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200;
      loop().connect(lp); lp.connect(eg); eg.connect(out);
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.2;
      const lg = ctx.createGain(); lg.gain.value = 0.04; lfo.connect(lg); lg.connect(eg.gain); lfo.start();
      seaG = ctx.createGain(); seaG.gain.value = 0;
      const sl = ctx.createBiquadFilter(); sl.type = 'lowpass'; sl.frequency.value = 500;
      loop().connect(sl); sl.connect(seaG); seaG.connect(out);
      const sw = ctx.createOscillator(); sw.frequency.value = 0.08;
      const sg = ctx.createGain(); sg.gain.value = 250; sw.connect(sg); sg.connect(sl.frequency); sw.start();
      cheerG = ctx.createGain(); cheerG.gain.value = 0; cheerG.connect(out);
      [[900, 0.7], [2200, 0.9], [420, 0.6]].forEach(([f, q]) => {
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
        loop().connect(bp); bp.connect(cheerG);
      });
    } catch (e) { console.error(e); }
  }
  const tone = (f, dur, g = 0.05, type = 'sine', f2 = null, when = 0) => {
    if (!ctx || !out) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.linearRampToValueAtTime(f2, t + dur);
    const gg = ctx.createGain(); gg.gain.setValueAtTime(g, t); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gg); gg.connect(out); o.start(t); o.stop(t + dur + 0.02);
  };
  const burst = (dur, freq, g = 0.2, when = 0) => {
    if (!ctx || !out || !nb) return;
    const t = ctx.currentTime + when;
    const b = ctx.createBufferSource(); b.buffer = nb;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const gg = ctx.createGain(); gg.gain.setValueAtTime(g, t); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    b.connect(f); f.connect(gg); gg.connect(out); b.start(t, Math.random()); b.stop(t + dur + 0.02);
  };
  return {
    init,
    clunk() { burst(0.04, 800, 0.5); tone(90, 0.12, 0.3); },
    tick() { tone(3000, 0.015, 0.08); },
    pencil() { for (let k = 0; k < 3; k++) burst(0.16, 3500, 0.06, k * 0.28); },
    squeak() {
      for (let k = 0; k < 3; k++) for (let j = 0; j < 6; j++) tone(1800 + Math.random() * 500, 0.06, 0.025, 'sine', null, k * 0.45 + j * 0.06);
    },
    print() {
      if (!ctx || !out) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(380, t); o.frequency.linearRampToValueAtTime(480, t + 1.2); o.frequency.linearRampToValueAtTime(380, t + 2.5);
      const g = ctx.createGain(); g.gain.value = 0.012;
      const am = ctx.createOscillator(); am.frequency.value = 30;
      const ag = ctx.createGain(); ag.gain.value = 0.01; am.connect(ag); ag.connect(g.gain);
      o.connect(g); g.connect(out); o.start(t); am.start(t); o.stop(t + 2.5); am.stop(t + 2.5);
      for (let k = 0; k < 30; k++) burst(0.02, 1500, 0.07, k / 12);
    },
    clank() { burst(0.25, 600, 0.5); tone(70, 0.4, 0.4); tone(180, 0.3, 0.15, 'square'); },
    cheer(v) { cheerT = v; },
    sea(v) { seaT = v; },
    hum(v) { humT = v; },
    update(dt, outside) {
      if (!ctx) return;
      cheerV += (cheerT * (0.45 + 0.55 * Math.random()) - cheerV) * Math.min(1, dt * 7);
      if (cheerG) cheerG.gain.value = cheerV * 0.3;
      seaV += (seaT - seaV) * Math.min(1, dt * 1.5);
      if (seaG) seaG.gain.value = seaV * 0.35;
      humV += (humT - humV) * Math.min(1, dt * 2);
      if (humG) humG.gain.value = 0.025 * humV;
      if (outside) {
        creakIn -= dt;
        if (creakIn < 0) { creakIn = 6 + Math.random() * 3; tone(120, 0.7, 0.035, 'sine', 90); }
      }
    },
  };
})();
['keydown', 'pointerdown', 'click'].forEach((e) => addEventListener(e, () => A.init(), { once: false }));

/* ---------- helpers ---------- */
const stdMat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });
const baseMat = (c, o = {}) => new THREE.MeshBasicMaterial({ color: c, ...o });
function box(w, h, d, x, y, z, c, parent = scene, m = null) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m || stdMat(c));
  b.position.set(x, y, z);
  parent.add(b);
  return b;
}
function hit(w, h, d, x, y, z, parent = scene) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ visible: false }));
  b.position.set(x, y, z);
  parent.add(b);
  return b;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return { c, ctx, tex, redraw: (fn) => { fn(ctx, w, h); tex.needsUpdate = true; } };
}
function textLines(ctx, lines, x, y, lh) {
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
}
const HAND = '"Bradley Hand","Segoe Script","Comic Sans MS",cursive';
const MARKER = 'bold 56px "Marker Felt","Permanent Marker","Comic Sans MS",cursive';
function beam(p1, p2, th, color, parent = scene) {
  const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2);
  const len = a.distanceTo(b);
  const m = new THREE.Mesh(new THREE.BoxGeometry(th, th, len), stdMat(color));
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.lookAt(b);
  parent.add(m);
  return m;
}

const rt = (() => { try { return new THREE.WebGLRenderTarget(512, 384, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter }); } catch (e) { return null; } })();
let fallback = !rt;
const screenUniforms = { tex: { value: rt ? rt.texture : null }, time: { value: 0 } };
const screenMat = new THREE.ShaderMaterial({
  uniforms: screenUniforms,
  toneMapped: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `varying vec2 vUv; uniform sampler2D tex; uniform float time;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec3 c = texture2D(tex, vUv).rgb;
      float l = dot(c, vec3(0.299,0.587,0.114));
      l = pow(l, 0.55) * 1.15;
      l += (h(vUv*512.0 + time) - 0.5) * 0.12;
      float sc = 0.85 + 0.15 * sin(vUv.y * 384.0 * 3.14159);
      float vg = 1.0 - 1.1 * dot(vUv - 0.5, vUv - 0.5);
      gl_FragColor = vec4(vec3(0.847,0.941,0.878) * l * sc * vg, 1.0);
    }`,
});

const clockTex = canvasTex(256, 256, () => {});
function drawClock() {
  clockTex.redraw((x, w, h) => {
    x.fillStyle = '#f2f2ee'; x.beginPath(); x.arc(128, 128, 122, 0, 7); x.fill();
    x.strokeStyle = '#111'; x.lineWidth = 6; x.stroke();
    x.fillStyle = '#111';

function updateSled(dt, t) {

  const k = Math.min(1, dt * 2.5);
  cam.x += (gx - cam.x) * k; cam.y += (gy - cam.y) * k; cam.ty += (gty - cam.ty) * k; cam.td += (gtd - cam.td) * k;

function captureStill() {
  const W = 320, H = 240;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  let ok = false;
  try {
    if (!rt || fallback) throw new Error('no rt');
    const buf = new Uint8Array(512 * 384 * 4);
    renderer.readRenderTargetPixels(rt, 0, 0, 512, 384, buf);
    const src = document.createElement('canvas'); src.width = 512; src.height = 384;
    const sx = src.getContext('2d');
    const id = sx.createImageData(512, 384);
    for (let y = 0; y < 384; y++) for (let xx = 0; xx < 512; xx++) {
      const si = ((383 - y) * 512 + xx) * 4, di = (y * 512 + xx) * 4;
      const l = (buf[si] * 0.299 + buf[si + 1] * 0.587 + buf[si + 2] * 0.114) / 255;
      const v = Math.min(255, Math.pow(l, 0.55) * 290);
      id.data[di] = id.data[di + 1] = id.data[di + 2] = v; id.data[di + 3] = 255;
    }
    sx.putImageData(id, 0, 0);
    x.drawImage(src, 0, 0, W, H);
    ok = true;
  } catch (e) { /* fall through */ }
  if (!ok) {
    x.fillStyle = '#555'; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 1500; i++) { x.fillStyle = `rgba(${Math.random() > 0.5 ? 255 : 0},${Math.random() > 0.5 ? 255 : 0},0,0.06)`; x.fillRect(Math.random() * W, Math.random() * H, 3, 3); }
    x.fillStyle = '#ddd'; x.beginPath(); x.ellipse(W / 2, H / 2, 70, 40, 0, 0, 7); x.fill();
  }
  const im = x.getImageData(0, 0, W, H), d = im.data;
  const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    const i = (y * W + xx) * 4;
    const v = d[i] / 255, thr = (bayer[(y & 3) * 4 + (xx & 3)] + 0.5) / 16;
    const dark = v * 1.05 < thr * 0.85;
    d[i] = dark ? 0x3a : 0xef; d[i + 1] = dark ? 0x31 : 0xe6; d[i + 2] = dark ? 0x28 : 0xcf; d[i + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  x.fillStyle = '#efe6cf'; x.fillRect(0, 0, W, 22); x.fillRect(0, H - 22, W, 22);
  x.fillStyle = '#3a3128'; x.font = 'bold 14px monospace';
  x.fillText(`ARGO   ${hms(S.time)}   CAM 2`, 8, 16);
  x.fillText('DEPTH 3781 m   ALT 8.2 m   HDG 184', 8, H - 7);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

  // idle hints
  if (S.phase === 'loop') {
    const now = performance.now();
    if (S.step === 'holding' && !S.holdHinted && now - S.holdAt > 8000 && S.contact === 0) {
      S.holdHinted = true;
      crew("PILOT: Frame hold's the red button. Then the printer.");
      act();
    } else if (now - S.lastAct > 20000 && ['frozen', 'printed', 'held', 'pinned'].includes(S.step)) {
      act();
      crew({ frozen: 'NAV: Print it.', printed: 'NAV: Take it. Then the board.', held: 'NAV: Board.', pinned: 'NAV: Book.' }[S.step]);
    }
  }
  // fantail
  const outside = player.position.x > 3.3;
  if (S.phase === 'fantail' && !S.ritual && Math.hypot(player.position.x - 12.2, player.position.z) < 1.2) fantailRitual();
  if (S.lock) {
    const dy = ((S.lock.yaw - player.yaw + PI) % (2 * PI) + 2 * PI) % (2 * PI) - PI;
    const k = Math.min(1, dt * 2.2);
    player.yaw += dy * k;
    player.pitch += (S.lock.pitch - player.pitch) * k;
  }
  if (S.doorT >= 0) A.hum(outside ? 0.15 : 0.6);
  A.update(dt, outside);
});

/* ---------- opening ---------- */
(async () => {
  drawOverlay(0);
  drawClock();
  await sleep(300);
  fade.style.opacity = 0;
  await caption('<b>North Atlantic, 1 September 1985.</b><br>Middle watch, 00:00 to 04:00, in the Argo van aboard R/V <i>Knorr</i>.<br>Two and a half miles under you, a camera sled is flying over the mud.', 5000);
  say('NAV: Your turn on the book. Card’s on the desk.');
  await sleep(2000);
  S.flyOK = true;
  act();
})();
</script>
