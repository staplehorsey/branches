// ---------- audio ----------
let ac = null;
const AC = () => {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); startHum(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
};
const noiseBuf = () => {
  const b = ac.createBuffer(1, ac.sampleRate * 1, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
};
function startHum() {
  const n = ac.createBufferSource(); n.buffer = noiseBuf(); n.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 140;
  const g = ac.createGain(); g.gain.value = 0.05;
  n.connect(f).connect(g).connect(ac.destination); n.start();
}
function tone(f, dur, type = 'sine', vol = 0.1, when = 0, f2 = null) {
  const a = AC(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, freq, when = 0, type = 'lowpass') {
  const a = AC(); if (!a) return;
  const t = a.currentTime + when, n = a.createBufferSource(); n.buffer = noiseBuf();
  const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = freq;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(fl).connect(g).connect(a.destination); n.start(t); n.stop(t + dur + 0.05);
}
const sTick = () => tone(1700, 0.03, 'square', 0.04);
const sPlace = () => { tone(900, 0.05, 'triangle', 0.12); noise(0.04, 0.2, 2500); };
const sCreak = () => { tone(80, 0.55, 'sawtooth', 0.07, 0, 170); tone(150, 0.4, 'sawtooth', 0.04, 0.1, 70); };
const sKnock = () => { tone(150, 0.14, 'sine', 0.5, 0, 70); noise(0.08, 0.35, 500); };
function sWhistle(f, when, dur = 0.45) {
  const a = AC(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  const l = a.createOscillator(), lg = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f * 0.97, t); o.frequency.linearRampToValueAtTime(f, t + 0.08);
  l.frequency.value = 6; lg.gain.value = f * 0.012; l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
  g.gain.setValueAtTime(0.16, t + dur - 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); l.start(t); o.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
  noise(dur, 0.05, f * 1.5, when, 'bandpass');
}

});

}

// needle
const needle = new THREE.Group();
const nm = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.02, 14, 8), M('#cfd4d8', { metalness: 0.9, roughness: 0.25 }));
nm.position.y = 7; needle.add(nm); needle.rotation.z = -0.35; AS.add(needle); needle.position.set(0, 3, 0);
const tip = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4040 })); AS.add(tip);

// ---------- state ----------
let mode = 'room', ft = 0, fromPos = new THREE.Vector3(), fromQuat = new THREE.Quaternion();
const SCR_POS = new THREE.Vector3(0, 1.875, -1.4), IDQ = new THREE.Quaternion();
let opened = false, cl = 0, phase = 'idle', holding = null, rot = 0, snapped = false;
let presses = 0, bulbT = 0, lastTick = 0, knocks = 0, finale = false;
const built = [false, false, false, false, false];
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
const plateText = (B.carried || []).find((x) => /plate/i.test(x)) || 'For Mara Szell, who hummed it first.';

// log + captions
const log = (k, t) => { logLines.push({ k, t }); drawStrip(); renderLog(); };
function renderLog() {
  txEl.innerHTML = '';
  for (const l of logLines.slice(-7)) {
    const d = document.createElement('div');
    d.className = l.k === 'V' ? 'v' : l.k === 'OK' ? 'ok' : l.k === 'SIG' ? 'sig' : '';
    d.textContent = l.k === 'V' ? 'VAHL: ' + l.t : l.k === 'SIG' ? l.t : l.t;
    txEl.appendChild(d);
  }
}
const Q = []; let cur = null, curEnd = 0;
const q = (...items) => Q.push(...items);
const busy = () => !!cur || Q.length > 0;
function pump(now) {
  if (cur && now < curEnd) return;
  if (cur) { capEl.style.opacity = 0; cur = null; }
  const it = Q.shift(); if (!it) return;
  if (it.fn) { it.fn(); return; }
  cur = it;
  if (it.wait) { curEnd = now + it.wait; return; }
  capEl.className = it.w === 'S' ? 's' : '';
  capEl.textContent = it.w === 'V' ? '“' + it.t + '”' : it.t;
  capEl.style.opacity = 1;
  log(it.w === 'V' ? 'V' : it.w === 'SIG' ? 'SIG' : 'S', it.t);
  curEnd = now + 1700 + it.t.length * 48;
}
const V = (t) => ({ w: 'V', t });
const S_ = (t) => ({ w: 'S', t });
const setObj = (t) => { objEl.textContent = t; };
setObj('Mr Vahl is waiting by the screen. Speak to him (E).');

// ---------- clauses ----------
const clauseGive = [
  [V('Clause one. I was on the landing outside her door on the evening of the eleventh of November, 2690. Third floor. The top stair creaked. Put the creak in.'), S_('Clause 1. Tolerance 0.2 mm. Creak: noted as acoustic property of tread 3.')],
  [V('Clause two. The stairwell light was on a timer. It went out twice. Both times I pressed it on again instead of knocking.')],
  [V('Clause three. Through the door I could hear her humming. Five notes, over and over, while the kettle came up. I wrote them on my cuff. Then I left the pencil on the newel post. I didn\'t need it. I wasn\'t going to forget.')],
  [V('Clause four. Flowers. From the machine at Kessel Street station; it only did chrysanthemums. I left them on the mat, no card. She\'d have known. I hope she knew. I never asked.'), S_('Clause 4 contains a hope. Hopes are not verifiable. Accepted as context.')],
  [V('Clause five. I did not knock.'), S_('Clause 5 is a clause of omission. §31(4): an omission is verified by performing it in the annex. Operator may act on the recipient\'s behalf.'), V('...Would you. Not loud. She hated loud. Three, the way you knock for someone you know.')],
];
function vahlUse() {
  if (mode !== 'room' || busy()) return;
  if (!opened) {
    opened = true;
    q(V('You brought it. Put it where I can see it on the wall. I can\'t see things that small any more. I can barely see things that size.'),
      V('There\'s a form. There\'s always a form. Section 31. I\'m allowed one more room. Not hers. Mine. The landing.'),
      S_('RD-31 STATEMENT OF GRIEF IN CLAUSES. Recipient: H. VAHL. Operator: Apprentice. Each clause must be verifiable in the annex. Begin.'),
      { fn: () => setObj('Speak to Mr Vahl again (E) for clause one.') });
    return;
  }
  if (finale) return q(V('Leave the door like that. Open.'));
  if (phase === 'idle' && cl <= 4) {
    phase = 'given';
    q(...clauseGive[cl], { fn: () => {
      if (cl <= 3) setObj('Go to the console (E) and build clause ' + (cl + 1) + ': pick the part from the tray.');
      else setObj('At the console: knock on the door with the needle, three times, softly.');
      renderTray();
    } });
    return;
  }
  q(V(Math.random() < 0.5 ? 'Go on. I\'m not going anywhere. Statistically.' : 'The form doesn\'t mind if you\'re slow. I mind a little.'));
}
s.thing(vahl, { label: 'Mr Vahl', use: vahlUse });
s.thing(cons, { label: 'the manipulator console', use: () => enterOp() });
s.thing(screen, { label: 'the wall screen (step inside)', use: () => enterOp() });

function clauseDone(i) {
  log('OK', '✓ Clause ' + (i + 1) + ' verified');
  phase = 'idle'; cl = i + 1; renderTray();
  if (i <= 3) setObj('Speak to Mr Vahl (E).');
}

function placePart() {
  const p = parts[holding];
  p.g.visible = true; p.outline.visible = false; p.ghost.visible = false;
  sPlace();
  const i = holding; holding = null; rot = 0; built[i] = true;
  if (i === 0) { q(V('That\'s it. That\'s the one. I stood on it so it wouldn\'t creak again.'), { fn: () => clauseDone(0) }); setObj('Tip: touch tread 3 with the needle. Then step back and speak to Mr Vahl.'); }
  if (i === 1) { bulb.visible = true; q(S_('Verify: actuate ×2.')); setObj('Press the red button on the switch with the needle, twice.'); }
  if (i === 2) q(V('I never did forget. It\'s the only thing I haven\'t.'), { fn: () => clauseDone(2) });
  if (i === 3) q(V('Yellow. They were yellow. Good.'), { fn: () => clauseDone(3) });
  if (i === 4) {
    finale = true;
    q(V('Leave the door like that. Open. Seal it open.'),
      S_('ANNEX SEALED. Delivery RD-9 accepted. Signature:'),
      { w: 'SIG', t: 'H. V.' },
      { fn: () => {
        tremble = 0; ledMat.color.set(0x40ff70); pipMat.color.set(0x40ff70); signed = true;
        setObj('The delivery is signed. The door is open (E).');
        leaveOp(); renderTray();
      } });
  }
  renderTray();
}

function knock() {
  if (!(cl === 4 && phase === 'given') || knocks >= 3) return;
  knocks++; sKnock(); shake = 0.5; doorPivot.rotation.y = -0.015;
  setTimeout(() => (doorPivot.rotation.y = 0), 90);
  if (knocks < 3) return;
  ring.visible = false;
  setTimeout(() => { bulbT = 0; bulb.visible = true; bulbOn = true; bulbLight.intensity = 1.4; bulb.material.color.set(0xffd890); }, 600);
  [440, 523.25, 659.25, 587.33, 880].forEach((f, i) => sWhistle(f, 1.0 + i * 0.5));
  setTimeout(() => { openT = 0; opening = true; }, 3500);
  q({ wait: 5200 }, { w: 'V', t: 'Mara.' },
    S_('Recipient named the deceased: MARA SZELL. First entry on public record. Clause 5 verified.'),
    { fn: () => {
      log('OK', '✓ Clause 5 verified');
      cl = 5; phase = 'given';
      setObj('The tray holds a credit plate. Mount it on the landing wall beside the door.');
      renderTray();
    } });
  phase = 'knocked';
}
let opening = false, openT = 0, bulbOn = false;

// ---------- operator mode ----------
function enterOp() {
  if (mode !== 'room') return;
  AC(); document.exitPointerLock?.();
  mode = 'in'; ft = 0;
  fromPos.copy(camera.position); fromQuat.copy(camera.quaternion);
  player.enabled = false; strip.visible = true;
  objEl.style.opacity = 0;
}
function leaveOp() {
  if (mode !== 'op' && mode !== 'in') return;
  mode = 'out'; ft = 0; opEl.style.display = 'none';
  if (kitCross) kitCross.style.opacity = 1;
}
function renderTray() {
  trayEl.innerHTML = '';
  const lab = document.createElement('span');
  const pi = cl === 5 ? 4 : cl;
  if (holding !== null) { lab.textContent = 'HOLDING: ' + partNames[holding] + ' · R rotates'; trayEl.appendChild(lab); return; }
  if (phase === 'given' && cl <= 3 && !built[pi] || (cl === 5 && phase === 'given' && !built[4])) {
    lab.textContent = 'TRAY:'; trayEl.appendChild(lab);
    const b = document.createElement('button'); b.textContent = partNames[pi];
    b.onclick = (e) => { e.stopPropagation(); pick(pi); };
    trayEl.appendChild(b);
  } else if (cl === 4 && phase !== 'idle') { lab.textContent = 'NO PART. SEE PROTOCOL.'; trayEl.appendChild(lab); }
  else if (cl === 1 && built[1] && presses < 2) { lab.textContent = 'VERIFY: actuate switch ×2 (' + presses + '/2)'; trayEl.appendChild(lab); }
  else { lab.textContent = 'TRAY EMPTY. Speak to Mr Vahl.'; trayEl.appendChild(lab); }
}
function pick(i) {
  holding = i; rot = startRot[i]; snapped = false;
  parts[i].ghost.visible = true; parts[i].outline.visible = true;
  sTick(); renderTray();
}
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const rc = new THREE.Raycaster(), rm = new THREE.Raycaster();
const hitP = new THREE.Vector3();
let hoverClick = null;
function clickables() {
  const c = [];
  if (built[0]) c.push(tread3);
  if (built[1] && presses < 2) c.push(switchBtn);
  if (cl === 4 && phase === 'given' && knocks < 3) c.push(doorM);
  return c;
}
function opUpdate(dt) {
  if (mode !== 'op') return;
  const ndc = new THREE.Vector2((mouse.x / innerWidth) * 2 - 1, -(mouse.y / innerHeight) * 2 + 1);
  rm.setFromCamera(ndc, camera);
  const h = rm.intersectObject(screen)[0];
  if (!h) return;
  rc.setFromCamera(new THREE.Vector2(h.uv.x * 2 - 1, h.uv.y * 2 - 1), AC_);
  hoverClick = null;
  if (holding !== null) {
    const p = parts[holding];
    plane.constant = -p.P.y;
    if (rc.ray.intersectPlane(plane, hitP)) {
      p.ghost.position.set(hitP.x, p.P.y, hitP.z);
      p.ghost.rotation.y = rot * Math.PI / 2;
      const dev = Math.hypot(hitP.x - p.P.x, hitP.z - p.P.z);
      const rotOk = rot % 4 === 0;
      snapped = dev < 3 && rotOk;
      if (snapped) { p.ghost.position.set(p.P.x, p.P.y, p.P.z); ghostMat.color.set(0x7dff9a); roEl.className = ''; roEl.textContent = (0.05 + dev / 3 * 0.15).toFixed(2) + ' mm WITHIN TOLERANCE. CLICK TO PLACE'; }
      else { ghostMat.color.set(0x7fe0ff); roEl.className = 'bad'; roEl.textContent = dev < 7 && !rotOk ? 'ORIENTATION: NON-CONFORMANT (R)' : 'DEVIATION ' + dev.toFixed(2) + ' mm'; }
      needle.position.set(hitP.x, p.P.y, hitP.z); tip.position.copy(needle.position);
    }
    roEl.style.display = 'block';
  } else {
    roEl.style.display = 'none';
    const hs = rc.intersectObjects(clickables(), false)[0];
    if (hs) { hoverClick = hs.object; needle.position.copy(hs.point); tip.position.copy(hs.point); }
    else { plane.constant = -3; if (rc.ray.intersectPlane(plane, hitP)) { needle.position.copy(hitP); tip.position.copy(hitP); } }
  }
  ring.material.opacity = 0.45 + 0.35 * Math.sin(performance.now() / 250);
}
addEventListener('click', (e) => {
  if (mode === 'room') return;
  e.stopPropagation(); e.preventDefault();
  if (mode !== 'op' || e.target.closest('#tray')) return;
  if (holding !== null) { if (snapped) placePart(); return; }
  if (hoverClick === tread3) sCreak();
  else if (hoverClick === switchBtn) {
    presses++; bulbT = 0; bulbOn = true; bulb.material.color.set(0xffd890); bulbLight.intensity = 1.4; renderTray();
    if (presses === 2) q(V('Eighty seconds of light I bought rather than one knock. Write that down. — Don\'t write that down.'), S_('Written.'), { fn: () => clauseDone(1) });
  } else if (hoverClick === doorM) knock();
}, true);
addEventListener('keydown', (e) => {
  if (e.code === 'KeyR' && mode === 'op' && holding !== null) { rot = (rot + 1) % 4; sTick(); }
  if ((e.code === 'KeyE' || e.code === 'KeyQ') && (mode === 'op')) { if (holding !== null) { parts[holding].ghost.visible = false; parts[holding].outline.visible = false; holding = null; renderTray(); } leaveOp(); }
});

// ---------- frame ----------
const tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler();
const ease = (k) => k * k * (3 - 2 * k);
let clockT = 0;
s.onFrame((dt, t) => {
  // arrival fade
  const af = Math.min(1, t / 3);
  arr.style.opacity = String(Math.max(0, 1 - af));
  if (af >= 1) arr.style.display = 'none';
  scene.background = new THREE.Color(arrCol).lerp(new THREE.Color('#b9c4b0'), Math.min(1, t));
  if (af >= 1 && !s._hinted) { s._hinted = true; B.say?.('Mr Vahl is waiting by the screen. Speak to him (E).'); }
  pump(performance.now());
  // animations
  tremble > 0 && hands.forEach((h, i) => { h.position.x = (i ? 0.09 : -0.09) + Math.sin(t * 38 + i) * 0.003 * tremble; h.position.z = -0.2 + Math.cos(t * 31 + i) * 0.003 * tremble; });
  if (bulbOn) {
    bulbT += dt;
    if (t - lastTick > 0.4) { lastTick = t; sTick(); }
    if (bulbT > 8 && !finale && knocks < 3) { bulbOn = false; bulbLight.intensity = 0; bulb.material.color.set(0x5a4a30); }
  }
  if (opening) { openT += dt; const k = Math.min(1, openT / 1.2); doorPivot.rotation.y = -ease(k) * (20 * Math.PI / 180); kitchenLight.intensity = 1.6 * k; if (k >= 1) opening = false; }
  ring.visible = cl === 4 && phase === 'given' && knocks < 3;
  if (cl >= 4 && phase !== 'idle') { /* keep ring */ }
  ledMat.color.lerp(finale && signed ? new THREE.Color(0x40ff70) : new THREE.Color(0xffa020), 0.1);
  shake *= Math.pow(0.02, dt);
  AC_.position.set(camBase.x + (Math.random() - 0.5) * shake, camBase.y + (Math.random() - 0.5) * shake, camBase.z);
  AC_.lookAt(5, 4, 3);
  opUpdate(dt);
  // camera flight
  if (mode === 'in') {
    ft += dt / 1.2; const k = ease(Math.min(1, ft));
    camera.position.lerpVectors(fromPos, SCR_POS, k); camera.quaternion.slerpQuaternions(fromQuat, IDQ, k);
    if (ft >= 1) {
      mode = 'op'; opEl.style.display = 'block'; strip.visible = false; if (kitCross) kitCross.style.opacity = 0;
      renderTray(); renderLog();
    }
  } else if (mode === 'op') {
    camera.position.copy(SCR_POS); camera.quaternion.copy(IDQ);
  } else if (mode === 'out') {
    ft += dt / 1.0; const k = ease(Math.min(1, ft));
    const tp = new THREE.Vector3(player.position.x, player.position.y + player.eye, player.position.z);
    tmpQ.setFromEuler(tmpE.set(player.pitch, player.yaw, 0, 'YXZ'));
    camera.position.lerpVectors(SCR_POS, tp, k); camera.quaternion.slerpQuaternions(IDQ, tmpQ, k);
    if (ft >= 1) { mode = 'room'; player.enabled = true; strip.visible = true; objEl.style.opacity = 0.85; }
  }
  if (mode !== 'op') strip.visible = true;
  // render annex into screen texture
  renderer.setRenderTarget(rt); renderer.render(AS, AC_); renderer.setRenderTarget(null);
});
setInterval(() => { if (mode === 'room' && ac) tone(2200, 0.012, 'square', 0.012); }, 1000);
drawStrip(); renderLog();
</script>
</body></html>
