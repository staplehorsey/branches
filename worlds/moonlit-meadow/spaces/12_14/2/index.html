<div id="intro" class="ui"><h1>INSIDE JOHNNY: THE DAY SHIFT</h1>Saturday, 7 a.m. The fever broke at three. Johnny is sitting up in bed with the expansion set open on his tray.<br><br><i>Click, then press E to lean in.</i></div>

<script type="module">
import * as THREE from "/vendor/three.module.js";
const B = window.branches || {};
const say = (t) => { try { B.say && B.say(t); } catch (e) {} };
const $ = (id) => document.getElementById(id);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#cfdcc4");
scene.fog = new THREE.Fog("#cfdcc4", 60, 180);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 600);
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const hemi = new THREE.HemisphereLight("#fff3d6", "#6b5a44", 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight("#ffd59a", 1.3);
sun.position.set(40, 18, 6); sun.target.position.set(0, 0, 0);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 120 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target, new THREE.AmbientLight("#ffffff", 0.15));

// ---------- helpers ----------
const cvs = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const tex = (c) => { const t = new THREE.CanvasTexture(c); if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.7, metalness: 0.15 }, o));
const box = (w, h, d, mat, x = 0, y = 0, z = 0, cast = true) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; return m;
};
const cyl = (rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 24) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
};
const R = (a, b) => a + Math.random() * (b - a);
const wrapText = (x, text, cx, cy, maxW, lh) => {
  const words = text.split(" "); let line = ""; let y = cy;
  for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > maxW && line) { x.fillText(line, cx, y); line = w; y += lh; } else line = t; }
  x.fillText(line, cx, y);
};
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<em>$1</em>");

// ---------- time: tweens and scheduler ----------
const tweens = []; const timers = []; let gameT = 0;
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
function tween(dur, fn, done, e) { tweens.push({ t: 0, dur, fn, done, e }); }
function later(sec, fn) { timers.push({ at: gameT + sec, fn }); }

// ---------- audio ----------
let AC = null, master = null, bus = null, noiseBuf = null, lowLayer = null;
function audioStart() {
  if (AC) { try { AC.resume(); } catch (e) {} return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    bus = AC.createGain(); const dl = AC.createDelay(); dl.delayTime.value = 0.17; const fb = AC.createGain(); fb.gain.value = 0.3;
    bus.connect(master); bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const hum = AC.createOscillator(); hum.frequency.value = 55; const hg = AC.createGain(); hg.gain.value = 0.02; hum.connect(hg); hg.connect(master); hum.start();
    setInterval(() => tick(), 1000);
  } catch (e) { AC = null; }
}
const safe = (fn) => (...a) => { if (!AC) return; try { return fn(...a); } catch (e) {} };
const tone = safe((f, type, dur, gain, f2, dest) => {
  const t = AC.currentTime; const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.05);
});
const nburst = safe((dur, ftype, f, Q, gain, dest) => {
  const t = AC.currentTime; const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 3;
  const fl = AC.createBiquadFilter(); fl.type = ftype; fl.frequency.value = f; fl.Q.value = Q;
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dest || master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
});
const tick = safe(() => nburst(0.03, "bandpass", 2400, 3, 0.05, bus));
const blip = safe((hz) => { const n = 4 + Math.floor(Math.random() * 3); for (let i = 0; i < n; i++) setTimeout(() => tone(hz * R(0.9, 1.15), "square", 0.06, 0.05), i * 70); });
const rustle = safe(() => nburst(0.15, "bandpass", 3000, 1, 0.25));
const clank = safe(() => { nburst(0.25, "bandpass", 1200, 8, 0.8); tone(600, "sine", 0.3, 0.2); });
const bong = safe(() => tone(180, "sine", 0.8, 0.5, 140));
const tock = safe(() => { tone(900, "triangle", 0.08, 0.2, 500); nburst(0.06, "bandpass", 1800, 4, 0.3); });
const tinClick = safe(() => { nburst(0.04, "highpass", 3000, 1, 0.4); tone(1400, "square", 0.04, 0.05); });
const ratchet = safe(() => { for (let i = 0; i < 3; i++) setTimeout(() => nburst(0.02, "highpass", 2500, 2, 0.35), i * 60); });
const lowRumbleLayer = safe((lvl) => {
  if (!lowLayer) {
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 80;
    const g = AC.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(master); s.start(); lowLayer = g;
  }
  lowLayer.gain.linearRampToValueAtTime(lvl, AC.currentTime + 0.4);
});
const bigRumble = safe(() => {
  const t = AC.currentTime;
  if (lowLayer) { lowLayer.gain.cancelScheduledValues(t); lowLayer.gain.linearRampToValueAtTime(0, t + 3); }
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 90;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1.6, t + 1.8); g.gain.linearRampToValueAtTime(0.0001, t + 5);
  const lfo = AC.createOscillator(); lfo.frequency.setValueAtTime(3, t); lfo.frequency.linearRampToValueAtTime(5, t + 3);
  const lg = AC.createGain(); lg.gain.value = 0.6; lfo.connect(lg); lg.connect(g.gain);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 5.2); lfo.start(t); lfo.stop(t + 5.2);
  const o = AC.createOscillator(); o.frequency.setValueAtTime(45, t); o.frequency.linearRampToValueAtTime(38, t + 3);
  const og = AC.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.linearRampToValueAtTime(0.5, t + 1.8); og.gain.linearRampToValueAtTime(0.0001, t + 4.5);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + 4.6);
  const o2 = AC.createOscillator(); o2.type = "sawtooth"; o2.frequency.setValueAtTime(70, t); o2.frequency.linearRampToValueAtTime(55, t + 3);
  const f2 = AC.createBiquadFilter(); f2.type = "lowpass"; f2.frequency.value = 220;
  const g2 = AC.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(0.18, t + 1.5); g2.gain.linearRampToValueAtTime(0.0001, t + 4);
  o2.connect(f2); f2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 4.1);
});
const whistle = safe(() => {
  const t = AC.currentTime; const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22, t + 0.4); g.gain.setValueAtTime(0.22, t + 1.8); g.gain.exponentialRampToValueAtTime(0.0005, t + 2.7);
  g.connect(master); g.connect(bus);
  [392, 494].forEach((fr, i) => {
    const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = fr * (i ? 1.004 : 1);
    const l = AC.createOscillator(); l.frequency.value = 5.5; const lg = AC.createGain(); lg.gain.value = 4; l.connect(lg); lg.connect(o.frequency);
    o.connect(g); o.start(t); l.start(t); o.stop(t + 2.8); l.stop(t + 2.8);
  });
  nburst(2.4, "highpass", 3500, 1, 0.05);
});

// ---------- the board ----------
const COL = { cream: "#efe2b8", red: "#b8382a", mustard: "#e8a317", green: "#3f6b5c", soot: "#1d130c", rust: "#8a4b2a", brass: "#c9a24a", peach: "#f1c9a5" };
const TRACK = (() => { // 40 squares round a rectangle
  const pts = []; const x0 = -10.4, x1 = 10.4, z0 = -6.9, z1 = 6.3; const W = x1 - x0, H = z1 - z0, P = 2 * (W + H);
  for (let i = 0; i < 40; i++) {
    let d = (i / 40) * P, x, z;
    if (d < W) { x = x0 + d; z = z0; } else if ((d -= W) < H) { x = x1; z = z0 + d; } else if ((d -= H) < W) { x = x1 - d; z = z1; } else { d -= W; x = x0; z = z1 - d; }
    pts.push([x, z]);
  }
  return pts;
})();
function boardTexture() {
  const S = 64, c = cvs(24 * S, 16 * S), x = c.getContext("2d");
  const X = (v) => (v + 12) * S, Z = (v) => (v + 8) * S;
  x.fillStyle = COL.cream; x.fillRect(0, 0, c.width, c.height);
  // paper grain
  for (let i = 0; i < 1400; i++) { x.fillStyle = `rgba(120,90,40,${R(0.02, 0.07)})`; x.fillRect(R(0, c.width), R(0, c.height), R(1, 4), R(1, 4)); }
  // boy silhouette
  x.lineWidth = 12; x.strokeStyle = COL.red; x.fillStyle = COL.peach; x.lineJoin = "round";
  x.beginPath(); x.arc(X(0), Z(-5.6), 1.7 * S, 0, Math.PI * 2); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(X(-5.2), Z(-3.6)); x.quadraticCurveTo(X(-1.2), Z(-4.4), X(0), Z(-4.0)); x.quadraticCurveTo(X(1.2), Z(-4.4), X(5.2), Z(-3.6));
  x.lineTo(X(5.6), Z(5.5)); x.lineTo(X(5.0), Z(7.2)); x.lineTo(X(-5.0), Z(7.2)); x.lineTo(X(-5.6), Z(5.5)); x.closePath(); x.fill(); x.stroke();
  x.fillStyle = "rgba(184,56,42,.12)"; x.fillRect(X(-5), Z(3.2), 10 * S, 4 * S);
  // face
  x.fillStyle = COL.soot; x.beginPath(); x.arc(X(-0.6), Z(-5.9), 8, 0, 7); x.arc(X(0.6), Z(-5.9), 8, 0, 7); x.fill();
  x.lineWidth = 6; x.strokeStyle = COL.soot; x.beginPath(); x.arc(X(0), Z(-5.3), 0.4 * S, 0.2, Math.PI - 0.2); x.stroke();
  // wire line vat hall -> switchboard
  x.strokeStyle = COL.red; x.lineWidth = 7; x.setLineDash([22, 12]); x.beginPath(); x.moveTo(X(-1), Z(0.9)); x.lineTo(X(0), Z(-4.9)); x.stroke(); x.setLineDash([]);
  // track
  x.font = "bold 22px 'Courier New',monospace"; x.textAlign = "center"; x.textBaseline = "middle";
  TRACK.forEach(([tx, tz], i) => {
    const s = 0.9 * S; x.fillStyle = i % 2 ? COL.cream : COL.mustard; x.strokeStyle = COL.soot; x.lineWidth = 3;
    x.fillRect(X(tx) - s / 2, Z(tz) - s / 2, s, s); x.strokeRect(X(tx) - s / 2, Z(tz) - s / 2, s, s);
    x.fillStyle = COL.soot; x.fillText(String(i + 1), X(tx), Z(tz));
  });
  // title
  x.save(); x.font = "bold 46px Impact,'Arial Narrow',sans-serif"; x.fillStyle = COL.red; x.fillText("T H E   D A Y   S H I F T  ·  MILTON & HARROW CO.", X(0), Z(7.55)); x.restore();
  // organ captions
  x.font = "italic 20px Georgia"; x.fillStyle = "rgba(29,19,12,.5)";
  x.fillText("EAR", X(-6), Z(-4.2)); x.fillText("LUNGS", X(-6.5), Z(1.2)); x.fillText("HEART", X(3), Z(0.2)); x.fillText("LIVER", X(7), Z(4.7)); x.fillText("STOMACH", X(-1), Z(0.4));
  // grit
  for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(29,19,12,${R(0.03, 0.12)})`; x.beginPath(); x.arc(R(0, c.width), R(0, c.height), R(4, 26), 0, 7); x.fill(); }
  x.strokeStyle = "rgba(110,60,20,.35)"; x.lineWidth = 6; x.beginPath(); x.arc(X(8.2), Z(-2.6), 38, 0, 5.8); x.stroke();
  return tex(c);
}
const boardTop = new THREE.Mesh(new THREE.PlaneGeometry(24, 16), new THREE.MeshStandardMaterial({ map: boardTexture(), roughness: 0.9 }));
boardTop.rotation.x = -Math.PI / 2; boardTop.position.y = 0.002; boardTop.receiveShadow = true; scene.add(boardTop);
scene.add(box(24, 0.2, 16, std("#8c7a52"), 0, -0.1, 0, false));
scene.add(box(30, 0.3, 22, std("#6a4a2c"), 0, -0.35, 0, false));
const tin = std(COL.green, { metalness: 0.4, roughness: 0.5 });
[[24, 0.3, -7.85], [24, 0.3, 7.85]].forEach(([w, d, z]) => scene.add(box(w, 0.4, d, tin, 0, 0.2, z)));
[-11.85, 11.85].forEach((x) => scene.add(box(0.3, 0.4, 16, tin, x, 0.2, 0)));
for (let i = -11; i <= 11; i += 1.5) { [-7.85, 7.85].forEach((z) => { const r = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), std("#9db5a8")); r.position.set(i, 0.41, z); scene.add(r); }); }

const bubbles = []; let windowMat = null;
const things = [];
// ---------- the giant room ----------
(() => {
  const q = cvs(256, 256), x = q.getContext("2d");
  x.fillStyle = "#f3efe4"; x.fillRect(0, 0, 256, 256); x.fillStyle = "#9fb4c8"; x.fillRect(0, 0, 128, 128); x.fillRect(128, 128, 128, 128);
  const t = tex(q); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(16, 16);
  const quilt = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: t, roughness: 1 }));
  quilt.rotation.x = -Math.PI / 2; quilt.position.y = -1; quilt.receiveShadow = true; scene.add(quilt);
  // lid
  const l = cvs(1360, 880), c = l.getContext("2d");
  c.fillStyle = COL.soot; c.fillRect(0, 0, 1360, 880); c.strokeStyle = COL.mustard; c.lineWidth = 14; c.strokeRect(30, 30, 1300, 820);
  c.fillStyle = "#3a2a1c"; // skyline in ribcage
  for (let i = 0; i < 9; i++) { c.strokeStyle = "#6b5a44"; c.lineWidth = 18; c.beginPath(); c.arc(680, 880, 220 + i * 40, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
  for (let i = 0; i < 14; i++) { const bx = 360 + i * 48, bh = R(80, 220); c.fillStyle = "#2a2018"; c.fillRect(bx, 640 - bh, 36, bh + 60); if (i % 3 === 0) { c.fillRect(bx + 10, 640 - bh - 60, 14, 60); c.fillStyle = "rgba(230,230,220,.5)"; c.beginPath(); c.arc(bx + 17, 640 - bh - 80, 18, 0, 7); c.fill(); } }
  c.textAlign = "center"; c.fillStyle = COL.mustard; c.font = "180px Impact,'Arial Narrow',sans-serif"; c.fillText("INSIDE JOHNNY", 680, 230);
  c.fillStyle = "#d9452f"; c.font = "110px Impact,'Arial Narrow',sans-serif"; c.fillText("THE DAY SHIFT", 680, 350);
  c.fillStyle = "#efe2b8"; c.font = "36px Georgia"; c.fillText("Expansion Set No. 2 · For 2 to 6 Players · Ages 6 and Up", 680, 740);
  c.font = "bold 40px Georgia"; c.fillStyle = COL.mustard; c.fillText("MILTON & HARROW CO. · 1955", 680, 800);
  const mats = [std("#2a2018"), std("#2a2018"), std("#2a2018"), std("#2a2018"), new THREE.MeshBasicMaterial({ map: tex(l) }), std("#2a2018")];
  const lid = new THREE.Mesh(new THREE.BoxGeometry(34, 22, 0.5), mats); lid.position.set(0, 10, -14); scene.add(lid);
  addThing(lid, { label: () => "The lid. Ages 6 and up.", use: () => say("The lid. Ages 6 and up."), reach: 80 });
  // glass
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(4, 3.6, 14, 32, 1, true), new THREE.MeshStandardMaterial({ color: "#d9b25a", transparent: true, opacity: 0.35, side: THREE.DoubleSide, roughness: 0.2 }));
  glass.position.set(20, 6, 14); scene.add(glass);
  const ale = new THREE.Mesh(new THREE.CylinderGeometry(3.9, 3.6, 10, 32), new THREE.MeshStandardMaterial({ color: "#d9b25a", transparent: true, opacity: 0.4 }));
  ale.position.set(20, 4, 14); scene.add(ale);
  addThing(glass, { label: () => "Ginger ale. Gone flat. Perfect.", use: () => say("Ginger ale. Gone flat. Perfect."), reach: 80 });

}
let noteReady = false, envelope = null, bubbleBoost = 1;
function giveNote() {
  if (noteTaken) return;
  noteTaken = true; invAdd("Mrs. Novak's note"); if (envelope) { dropThing(envelope); scene.remove(envelope); }
  openPanel("note", `<div class="from">From the desk of Mrs. H. Novak</div>
<p>Dear Miss Halloran,</p>
<p>Please excuse John from school on Friday and Monday. He had a fever of 103 on Friday night. It broke at three o'clock this morning.</p>
<p>He has just asked for toast.</p>
<p>He will be back on Tuesday. Thank you for the cards. I have read them to him twice, and he laughed at Ronnie's.</p>
<p>Sincerely,<br>Mrs. Helen Novak</p>`, afterNote);
  rustle();
}
function afterNote() {
  if (toastShown) return; toastShown = true;
  const plate = new THREE.Group(); plate.position.set(-45, -0.5, 0); scene.add(plate);
  plate.add(cyl(12, 11, 0.4, std("#f4f4ee", { roughness: 0.3 }), 0, 0, 0, 40));
  const gold = std("#d9a05b", { roughness: 0.9 });
  for (let i = 0; i < 5; i++) plate.add(box(1.9, 1.2, 10, gold, -4.1 + i * 2.05, 0.8, 0));
  plate.add(box(2.0, 0.2, 10.1, std("#8a5a2b"), -4.1, 1.45, 0), box(2.0, 0.2, 10.1, std("#8a5a2b"), 4.1, 1.45, 0));
  plate.add(box(2, 0.4, 2, std("#f6e48a"), 0, 1.6, 0));
  plate.rotation.y = Math.PI / 2;
  tween(2, (k) => { plate.position.x = -45 + 23 * ease(k); });
  const s = box(0.25, 0.25, 1.2, std("#d9a05b"), -11, 0.4, 0); s.rotation.x = 0; s.rotation.z = 0.0; s.rotation.y = 0; s.castShadow = true;
  s.position.set(-11.2, 0.6, 0); s.rotation.set(0, Math.PI / 2, 0.5); scene.add(s);
  addThing(s, { label: () => "a toast soldier. Still warm.", use: () => { invAdd("A toast soldier"); dropThing(s); scene.remove(s); rustle(); say("Warm. It's carrying butter."); }, reach: 5.5 });
  say("Toast. Cut into soldiers. Take one for the road.");
  lightDay();
  later(2.5, () => say("Hobbs: Day shift's on. Off you go, all players advance. Mind the track."));
}

// ---------- intro, dive ----------
const camStart = new THREE.Vector3(0, 18, 22);
let introT = 0, clickT = null;
function dive() {
  if (mode !== "intro") return; mode = "dive"; $("intro").style.display = "none";
  const p0 = camStart.clone(), p1 = new THREE.Vector3(-3, 12, 8), p2 = new THREE.Vector3(P.x, 1.6, P.z);
  const l0 = new THREE.Vector3(0, 0, 0), l1 = new THREE.Vector3(P.x, 1.6, P.z - 10);
  tween(2.8, (k) => {
    const a = 1 - k;
    camera.position.set(a * a * p0.x + 2 * a * k * p1.x + k * k * p2.x, a * a * p0.y + 2 * a * k * p1.y + k * k * p2.y, a * a * p0.z + 2 * a * k * p1.z + k * k * p2.z);
    camera.lookAt(new THREE.Vector3().lerpVectors(l0, l1, k));
  }, () => {
    mode = "play"; P.yaw = 0; P.pitch = 0; tock(); landedAt = gameT; hud(); drawBag();
    say("Gatekeeper Hobbs is at the Mail Chute. Walk up and press E.");
    if (!carriedThermo) {
      const th = makeThermo(); th.rotation.z = Math.PI / 2; th.position.set(-1.8, 0.07, 3.5); scene.add(th);
      th.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })));
      addThing(th, { label: () => "a thermometer, shaken down. 37.0. Somebody left it here after last night.", use: () => { invAdd("Thermometer"); dropThing(th); scene.remove(th); rustle(); say("37.0. Shaken down. Somebody left it here after last night."); }, reach: 5 });
    }
  }, ease);
}
const carriedThermo = (() => { try { return JSON.stringify(B.carried || []).toLowerCase().includes("thermometer"); } catch (e) { return false; } })();
if (carriedThermo) inv.push("Thermometer");
hud(); drawBag();

// ---------- input ----------
const keys = new Set();
addEventListener("keydown", (e) => {
  keys.add(e.code);
  if (e.code === "KeyE") {
    if (mode === "intro") { audioStart(); return dive(); }
    if (reading) return closePanel();
    if (mode === "play" && lookTarget) lookTarget.use();
  } else if (e.code === "KeyR") {
    if (mode === "play" && !reading && isCard(sel())) showCard(sel());
  } else if (/^Digit[1-9]$/.test(e.code)) {
    if (mode !== "play") return;
    const i = parseInt(e.code.slice(5), 10) - 1;
    if (i < inv.length) { selected = selected === i ? -1 : i; drawBag(); }
  }
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
addEventListener("click", () => {
  audioStart();
  if (reading) return closePanel();
  if (mode === "intro") { if (clickT === null) clickT = introT; else if (introT - clickT > 1) dive(); }
  try { if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock(); } catch (e) {}
});
addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== renderer.domElement || mode !== "play") return;
  P.yaw -= e.movementX * 0.0022; P.pitch = Math.max(-1.4, Math.min(1.4, P.pitch - e.movementY * 0.0022));
});

// ---------- loop ----------
const ray = new THREE.Raycaster(); let lookTarget = null;
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  gameT += dt; if (mode === "intro") { introT += dt; if (introT > 40) dive(); }
  // tweens/timers
  for (const t of tweens.slice()) {
    t.t += dt; const k = Math.min(1, t.t / t.dur);
    try { t.fn(t.e ? t.e(k) : k); } catch (e) {}
    if (k >= 1) { tweens.splice(tweens.indexOf(t), 1); try { t.done && t.done(); } catch (e) {} }
  }
  for (const t of timers.slice()) if (gameT >= t.at) { timers.splice(timers.indexOf(t), 1); try { t.fn(); } catch (e) {} }
  // movement
  if (mode === "play" && !reading) {
    const f = (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) - (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0);
    const r = (keys.has("KeyD") ? 1 : 0) - (keys.has("KeyA") ? 1 : 0);
    if (keys.has("ArrowLeft")) P.yaw += dt * 1.8; if (keys.has("ArrowRight")) P.yaw -= dt * 1.8;
    if (f || r) {
      const v = (3 * (keys.has("ShiftLeft") ? 1.8 : 1) * dt) / Math.hypot(f, r);
      P.x += (-Math.sin(P.yaw) * f + Math.cos(P.yaw) * r) * v; P.z += (-Math.cos(P.yaw) * f - Math.sin(P.yaw) * r) * v;
    }
    P.x = Math.max(-11.4, Math.min(11.4, P.x)); P.z = Math.max(-7.4, Math.min(7.4, P.z));
    for (const c of colliders) { const dx = P.x - c.x, dz = P.z - c.z, d = Math.hypot(dx, dz), m = c.r + 0.25; if (d < m && d > 0.0001) { P.x = c.x + (dx / d) * m; P.z = c.z + (dz / d) * m; } }
  }
  if (mode === "play" || mode === "script") {
    camera.position.set(P.x, 1.6, P.z); camera.rotation.set(P.pitch, P.yaw, 0, "YXZ");
    if (gameT < shakeUntil) { const a = shakeAmp * ((shakeUntil - gameT) / 1.8 + 0.2); camera.position.x += R(-a, a); camera.position.y += R(-a, a); }
  } else if (mode === "intro") { camera.position.copy(camStart); camera.lookAt(0, 0, 0); }
  // look
  lookTarget = null;
  if (mode === "play" && !reading) {
    ray.setFromCamera(new THREE.Vector2(0, 0), camera); ray.far = 100;
    const hits = ray.intersectObjects(things.map((t) => t.obj), true);
    for (const h of hits) {
      let o = h.object; let th = null;
      while (o && !(th = things.find((t) => t.obj === o))) o = o.parent;
      if (th && h.distance <= th.reach) { lookTarget = th; break; }
      if (th) break;
    }
    // foreman groups are things via standup registration below
  }
  const s = sel();
  $("hint").textContent = lookTarget ? `E: ${lookTarget.label()}` : "";
  $("cross").style.background = lookTarget ? "#ffd27a" : "rgba(255,255,255,.85)";
  $("cross").style.display = mode === "play" ? "block" : "none";
  void s;
  // ambient animation
  for (const b of bubbles) { b.position.y += b.userData.sp * dt * bubbleBoost; if (b.position.y > 9.5) b.position.y = -0.5; }
  if (bubbleBoost > 1 && gameT > shakeUntil + 3) bubbleBoost = 1;
  Object.values(standups).forEach((st) => {
    let d = st.target - st.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); st.yaw += d * Math.min(1, dt * 3); st.g.rotation.y = st.yaw;
    st.g.rotation.z = gameT < wobbleUntil ? Math.sin(gameT * 35) * 0.06 : 0;
  });
  if (lampFlick > 0) { lampFlick -= dt; lamps.forEach((l) => l.material.color.set(Math.random() < 0.5 ? "#ffb62e" : "#555533")); if (lampFlick <= 0 && !rumbled) lamps.forEach((l) => l.material.color.set("#a67a22")); }
  if (spinning && fittedParts.Flywheel) { fittedParts.Flywheel.userData.wheel.rotation.z += dt * 1.5; fittedParts.Churn.rotation.y += dt * 0.6; }
  if (dayLit) dayMat.emissiveIntensity = 0.5 + 0.3 * Math.sin(gameT * (Math.PI * 2 / 1.2));
  // proximity onward
  if (dayLit && !leaving && mode === "play" && Math.hypot(P.x - 3, P.z - 6.3) < 0.8) leave();
  // failsafe
  if (landedAt !== null && !rumbled && !dayLit && gameT - landedAt > 330) {
    lightDay(); say("HOBBS: Look, the day shift'll start with or without the paperwork. The DAY square's lit whenever you're ready.");
  }
  renderer.render(scene, camera);
});

// foremen as interactables (after helper definitions)
Object.values(standups).forEach((s) => {
  addThing(s.g, {
    label: () => { const c = sel(); const n = FD[s.id].name; if (s.id === "hobbs") return noteReady && !noteTaken ? "take Mrs. Novak's note" : `talk to ${n}`; return c && isCard(c) && !s.done ? `give ${c} to ${n}` : `talk to ${n}`; },
    use: () => talkForeman(s.id),
  });
});
</script>
</body></html>
