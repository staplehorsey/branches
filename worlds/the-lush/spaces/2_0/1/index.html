<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept at Golden Hour</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2b48a; }
  canvas { display: block; }
  #fade { position: fixed; inset: 0; background: #f2b48a; pointer-events: none; opacity: 1; transition: opacity 2.6s ease; z-index: 5; }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 4;
         background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(60,20,10,0.28) 100%); }
  #hint { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); color: rgba(90,40,20,.7);
          font: 13px/1.4 Georgia, serif; letter-spacing: .12em; pointer-events: none; transition: opacity 1.6s; z-index: 6; text-align: center; }
  #oops { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #7a3a1e; font: 16px Georgia, serif; display: none; z-index: 7; }
</style>
</head>
<body>
<div id="fade"></div>
<div id="vig"></div>
<div id="hint">click to look &nbsp;·&nbsp; W A S D to walk</div>
<div id="oops">The glass has fogged over. Press Esc to go back to the house.</div>
<script type="module">
import * as THREE from '/vendor/three.module.js';

const B = window.branches || {
  onward() { parent.postMessage({ branches: 'onward' }, '*'); },
  back() { parent.postMessage({ branches: 'back' }, '*'); },
  say(t) { console.log(t); },
};
const say = (t, s) => { try { B.say(t, s); } catch (e) {} };

try { main(); } catch (e) {
  document.getElementById('oops').style.display = 'block';
  document.getElementById('fade').style.opacity = '0';
  throw e;
}

function main() {
  // ------------------------------------------------------------ rng
  let seed = 3601047423;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const rr = (a, b) => a + (b - a) * rnd();
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;

  // ------------------------------------------------------------ world constants
  const R = 14;          // glass radius
  const RMAX = 13.35;    // how far you can walk
  const GLASS_TOP = 18.5;
  const SILL_Y = -0.5;
  let sunElev = 0.1;
  const SUN_AZ = 0;      // the sun lies toward +z
  const sunDir = new THREE.Vector3();
  const updateSunDir = () => sunDir.set(Math.cos(sunElev) * Math.sin(SUN_AZ), Math.sin(sunElev), Math.cos(sunElev) * Math.cos(SUN_AZ));
  updateSunDir();

  // ------------------------------------------------------------ renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf2b48a, 8, 70);
  const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 1500);
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });

  // ------------------------------------------------------------ palette (day -> night)
  const C = (h) => new THREE.Color(h);
  const DAY = { fog: C('#f2b48a'), hemiSky: C('#ffcf9e'), hemiGround: C('#a2603a'), skyTop: C('#cf6f6a'), skyHor: C('#ffd2a6'), skyBot: C('#f2b48a'), sunCol: C('#fff0c6'), sunLight: C('#ff9a5c') };
  const NIGHT = { fog: C('#0e1326'), hemiSky: C('#1e2744'), hemiGround: C('#07080f'), skyTop: C('#070a18'), skyHor: C('#1b2340'), skyBot: C('#0e1326'), sunCol: C('#ff7a3a'), sunLight: C('#ff4a1a') };

  // ------------------------------------------------------------ sky
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      uTop: { value: DAY.skyTop.clone() }, uHor: { value: DAY.skyHor.clone() }, uBot: { value: DAY.skyBot.clone() },
      uSunCol: { value: DAY.sunCol.clone() }, uSunDir: { value: sunDir }, uNight: { value: 0 },
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uTop, uHor, uBot, uSunCol, uSunDir; uniform float uNight; varying vec3 vDir;
      float hash(vec3 p){ p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 col = h > 0.0 ? mix(uHor, uTop, pow(h, 0.5)) : mix(uHor, uBot, pow(-h, 0.5));
        vec3 s = normalize(uSunDir); float a = acos(clamp(dot(d, s), -1.0, 1.0));
        float disc = 1.0 - smoothstep(0.035, 0.045, a);
        float glow = exp(-a * 5.0) * 0.7 + exp(-a * 1.6) * 0.35;
        col += uSunCol * (disc * 1.6 + glow * (1.0 - uNight));
        col += uHor * 0.15 * exp(-abs(h) * 8.0) * (1.0 - uNight);
        vec3 g = floor(d * 140.0); float sr = hash(g); vec3 c = normalize((g + 0.5) / 140.0);
        float star = step(0.986, sr) * (1.0 - smoothstep(0.0, 0.004, length(d - c))) * uNight * smoothstep(0.0, 0.2, h);
        col += vec3(0.8, 0.85, 1.0) * star * (0.5 + 0.5 * hash(g + 1.0));
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide, depthWrite: false,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 48, 24), skyMat);
  scene.add(sky);

  // ------------------------------------------------------------ lights
  const hemi = new THREE.HemisphereLight(DAY.hemiSky.clone(), DAY.hemiGround.clone(), 1.1);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(DAY.sunLight.clone(), 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -17; sun.shadow.camera.right = 17; sun.shadow.camera.top = 17; sun.shadow.camera.bottom = -17;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 130;
  sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.03;
  sun.position.copy(sunDir).multiplyScalar(60);
  sun.target.position.set(0, 0, 0);
  scene.add(sun); scene.add(sun.target);
  const moon = new THREE.DirectionalLight(0x8fa6d8, 0);
  moon.position.set(3, 10, -4);
  scene.add(moon);

  // ------------------------------------------------------------ textures
  const canvasTex = (w, h, draw) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return t;
  };
  const colLerp = (a, b, u) => C(a).lerp(C(b), u).getStyle();

  const sandTex = canvasTex(2048, 2048, (g, W, H) => {
    g.fillStyle = '#e6c08f'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 60000; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(201,154,98,0.4)' : 'rgba(248,224,186,0.4)';
      const s = 1 + rnd() * 3; g.fillRect(rnd() * W, rnd() * H, s, s);
    }
    for (let i = 0; i < 700; i++) {
      g.fillStyle = `rgba(${120 + rnd() * 60 | 0},${105 + rnd() * 50 | 0},${90 + rnd() * 40 | 0},0.55)`;
      g.beginPath(); g.ellipse(rnd() * W, rnd() * H, 2 + rnd() * 6, 1.5 + rnd() * 4, rnd() * 3, 0, Math.PI * 2); g.fill();
    }
    for (let k = 0; k < 22; k++) {
      const cx = rnd() * W, cy = rnd() * H, r = 80 + rnd() * 160;
      for (let j = 0; j < 60; j++) {
        g.fillStyle = `rgba(${70 + rnd() * 40 | 0},${120 + rnd() * 50 | 0},${60 + rnd() * 30 | 0},0.5)`;
        g.beginPath(); g.arc(cx + (rnd() - 0.5) * r, cy + (rnd() - 0.5) * r, r * 0.22 * (0.4 + rnd()), 0, Math.PI * 2); g.fill();
      }
    }
  });

  const frondTex = canvasTex(256, 512, (g, W, H) => {
    g.clearRect(0, 0, W, H);
    g.strokeStyle = '#4a7a38'; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(W / 2, H); g.quadraticCurveTo(W / 2 + 10, H * 0.5, W / 2, 8); g.stroke();
    const n = 24;
    for (let i = 0; i < n; i++) {
      const u = i / n; const y = H - 10 - u * (H - 30);
      const len = (1 - u * 0.85) * (W * 0.46) * (0.6 + 0.4 * Math.sin(u * Math.PI * 0.9 + 0.3));
      const col = colLerp('#3f7a3a', '#8fc062', u);
      for (const s of [-1, 1]) {
        g.save(); g.translate(W / 2, y); if (s < 0) g.scale(-1, 1); g.rotate(-0.95 + u * 0.35);
        g.fillStyle = col; g.beginPath(); g.ellipse(len * 0.5, 0, len * 0.5, 6 + (1 - u) * 7, 0, 0, Math.PI * 2); g.fill();
        g.restore();
      }
    }
  });

  const grassTex = canvasTex(128, 128, (g, W, H) => {
    g.clearRect(0, 0, W, H); g.lineCap = 'round';
    for (let i = 0; i < 11; i++) {
      const x0 = W / 2 + (rnd() - 0.5) * 20, x1 = W / 2 + (rnd() - 0.5) * 110, h = 20 + rnd() * 60;
      g.strokeStyle = colLerp('#4f8a3f', '#b8e46c', rnd()); g.lineWidth = 3 + rnd() * 3;
      g.beginPath(); g.moveTo(x0, H); g.quadraticCurveTo((x0 + x1) / 2 + (rnd() - 0.5) * 30, H - h * 0.6, x1, h); g.stroke();
    }
  });

  const petalTex = canvasTex(256, 256, (g, W, H) => {
    g.clearRect(0, 0, W, H); const cx = W / 2;
    for (let i = 0; i < 14; i++) {
      g.save(); g.translate(cx, cx); g.rotate(i / 14 * Math.PI * 2);
      const grad = g.createLinearGradient(20, 0, 122, 0);
      grad.addColorStop(0, '#e8713c'); grad.addColorStop(0.5, '#ffd166'); grad.addColorStop(1, '#ffe8a8');
      g.fillStyle = grad; g.beginPath(); g.ellipse(72, 0, 52, 15, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    const rg = g.createRadialGradient(cx, cx, 4, cx, cx, 38);
    rg.addColorStop(0, '#c2553a'); rg.addColorStop(1, '#6e2718');
    g.fillStyle = rg; g.beginPath(); g.arc(cx, cx, 38, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,210,120,0.5)';
    for (let i = 0; i < 40; i++) { const a = i * 2.39996, r = 4 + Math.sqrt(i) * 5; g.beginPath(); g.arc(cx + Math.cos(a) * r, cx + Math.sin(a) * r, 2, 0, Math.PI * 2); g.fill(); }
  });

  const damaskTex = canvasTex(256, 256, (g, W, H) => {
    g.fillStyle = '#f6c39b'; g.fillRect(0, 0, W, H);
    const ogee = (cx, cy, r, col) => {
      g.fillStyle = col; g.beginPath();
      g.moveTo(cx, cy - r);
      g.quadraticCurveTo(cx + r * 0.2, cy - r * 0.2, cx + r, cy);
      g.quadraticCurveTo(cx + r * 0.2, cy + r * 0.2, cx, cy + r);
      g.quadraticCurveTo(cx - r * 0.2, cy + r * 0.2, cx - r, cy);
      g.quadraticCurveTo(cx - r * 0.2, cy - r * 0.2, cx, cy - r);
      g.fill();
    };
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const cx = 64 + 128 * i, cy = 64 + 128 * j;
      ogee(cx, cy, 50, '#e8a477'); ogee(cx, cy, 30, '#f2b98c'); ogee(cx, cy, 12, '#e8a477');
      g.fillStyle = '#e8a477'; g.beginPath(); g.arc(cx + 64, cy + 64, 5, 0, Math.PI * 2); g.fill();
    }
  });
  damaskTex.wrapS = damaskTex.wrapT = THREE.RepeatWrapping; damaskTex.repeat.set(2, 3.5);

  const dropTex = canvasTex(512, 512, (g, W, H) => {
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,0.16)'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 420; i++) {
      const r = 1 + rnd() * 5; g.fillStyle = `rgba(255,255,255,${0.35 + rnd() * 0.4})`;
      g.beginPath(); g.arc(rnd() * W, rnd() * H, r, 0, Math.PI * 2); g.fill();
    }
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2;
    for (let i = 0; i < 18; i++) { const x = rnd() * W, y = rnd() * H; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 6, y + 40 + rnd() * 120); g.stroke(); }
  });
  dropTex.wrapS = dropTex.wrapT = THREE.RepeatWrapping; dropTex.repeat.set(7, 2.5);

  const haloTex = canvasTex(256, 256, (g, W, H) => {
    g.clearRect(0, 0, W, H);
    const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    rg.addColorStop(0, 'rgba(190,245,235,1)'); rg.addColorStop(0.35, 'rgba(121,211,204,0.45)'); rg.addColorStop(1, 'rgba(121,211,204,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  });

  // ------------------------------------------------------------ the sill and the sand
  const sill = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshLambertMaterial({ color: 0xb8805a }));
  sill.rotation.x = -Math.PI / 2; sill.position.y = SILL_Y; sill.receiveShadow = true;
  scene.add(sill);
  const sand = new THREE.Mesh(new THREE.CircleGeometry(R - 0.05, 96), new THREE.MeshLambertMaterial({ map: sandTex }));
  sand.rotation.x = -Math.PI / 2; sand.position.y = 0; sand.receiveShadow = true;
  scene.add(sand);
  // soil layers seen through the glass from inside near the edge are not visible; the jar's base ring:
  const base = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.02, R - 0.02, 0.5, 96, 1, true), new THREE.MeshLambertMaterial({ color: 0x8a6a4a, side: THREE.DoubleSide }));
  base.position.y = -0.25; scene.add(base);

  // a giant window frame far off, between us and the sun
  const frameMat = new THREE.MeshLambertMaterial({ color: 0x5a3a2a });
  for (const x of [-22, 22]) { const m = new THREE.Mesh(new THREE.BoxGeometry(1.8, 60, 1.8), frameMat); m.position.set(x, 29, 58); scene.add(m); }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(46, 1.6, 1.8), frameMat); bar.position.set(0, 24, 58); scene.add(bar);

  // ------------------------------------------------------------ colliders & player
  const colliders = [];
  const player = { x: 0, z: -9.3, yaw: Math.PI, pitch: 0, eye: 1.6, speed: 2.7 };
  const start = { x: 0, z: -9.3 };

  // ------------------------------------------------------------ the door you came through
  {
    const g = new THREE.Group(); g.position.set(0, 0, -10.5);
    const wallMat = new THREE.MeshLambertMaterial({ map: damaskTex });
    const trimMat = new THREE.MeshLambertMaterial({ color: 0xb35f3a });
    for (const sx of [-1, 1]) {
      const w = new THREE.Mesh(new THREE.BoxGeometry(2.0, 3.8, 0.28), wallMat);
      w.position.set(sx * 1.75, 1.9, 0); w.castShadow = true; w.receiveShadow = true; g.add(w);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.12, 0.36), trimMat); cap.position.set(sx * 1.75, 3.84, 0); g.add(cap);
      const skirt = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.22, 0.34), trimMat); skirt.position.set(sx * 1.75, 0.11, 0); g.add(skirt);
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 3.7, 0.34), trimMat); post.position.set(sx * 0.73, 1.85, 0); post.castShadow = true; g.add(post);
      colliders.push({ rect: true, x0: sx > 0 ? 0.65 : -2.75, x1: sx > 0 ? 2.75 : -0.65, z0: -10.64, z1: -10.36 });
    }
    const lintel = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.16, 0.34), trimMat); lintel.position.set(0, 3.62, 0); g.add(lintel);
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.3, 3.5, 0.08), new THREE.MeshLambertMaterial({ color: 0xf4b9c1 }));
    const hinge = new THREE.Group(); hinge.position.set(-0.65, 0, -0.05); hinge.rotation.y = -1.9;
    door.position.set(0.65, 1.78, 0); door.castShadow = true; hinge.add(door);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshPhongMaterial({ color: 0xd9b36a, shininess: 90 }));
    knob.position.set(1.15, 1.7, 0.07); hinge.add(knob);
    g.add(hinge);
    scene.add(g);
    // sand drifted against the wall
    const drift = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshLambertMaterial({ map: sandTex }));
    drift.scale.set(3.2, 0.35, 0.9); drift.position.set(1.6, 0, -10.2); scene.add(drift);
  }

  // ------------------------------------------------------------ plants
  const frondMat = new THREE.MeshLambertMaterial({ map: frondTex, alphaTest: 0.5, side: THREE.DoubleSide });
  const frondGeo = new THREE.PlaneGeometry(1, 2); frondGeo.translate(0, 1, 0);
  const flowersSpec = [
    { x: 3.5, z: -4.0, h: 3.6 }, { x: -6.5, z: 1.0, h: 4.4 }, { x: 6.0, z: 6.5, h: 3.3 },
    { x: -2.5, z: 9.5, h: 4.6 }, { x: 9.5, z: -2.0, h: 3.9 },
  ];
  const CRACK_A = -140 * Math.PI / 180;
  const crack = { x: 13.9 * Math.sin(CRACK_A), z: 13.9 * Math.cos(CRACK_A) };
  const d2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);
  const nearFlower = (x, z, m) => flowersSpec.some((f) => d2(x, z, f.x, f.z) < m);
  const nearDoor = (x, z) => z > -12 && z < -9.4 && Math.abs(x) < 3;

  const makeFern = (x, z, s) => {
    const g = new THREE.Group(); g.position.set(x, 0, z);
    const n = 7 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(frondGeo, frondMat);
      m.rotation.order = 'YXZ';
      m.rotation.y = i / n * Math.PI * 2 + rr(-0.3, 0.3);
      m.rotation.x = rr(0.45, 1.05);
      const k = s * rr(0.8, 1.2); m.scale.set(k * 0.9, k, 1);
      m.castShadow = true; m.receiveShadow = true; g.add(m);
    }
    // a couple of young fronds standing straighter
    for (let i = 0; i < 2; i++) {
      const m = new THREE.Mesh(frondGeo, frondMat); m.rotation.order = 'YXZ';
      m.rotation.y = rnd() * Math.PI * 2; m.rotation.x = rr(0.1, 0.3);
      const k = s * rr(0.5, 0.7); m.scale.set(k * 0.8, k, 1); m.castShadow = true; g.add(m);
    }
    scene.add(g);
  };
  const boulderMat = new THREE.MeshLambertMaterial({ color: 0x8b7f72, flatShading: true });
  const makeBoulder = (x, z, r) => {
    const geo = new THREE.DodecahedronGeometry(r, 1);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) { const k = rr(0.82, 1.15); p.setXYZ(i, p.getX(i) * k, p.getY(i) * k * rr(0.6, 0.8), p.getZ(i) * k); }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, boulderMat.clone()); m.material.color.offsetHSL(rr(-0.02, 0.04), rr(-0.05, 0.08), rr(-0.08, 0.06));
    m.position.set(x, r * 0.25, z); m.rotation.y = rnd() * 6.28; m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    colliders.push({ x, z, r: r * 0.95 });
  };
  const mossMat = new THREE.MeshLambertMaterial({ color: 0x4f8a3f });
  const makeMoss = (x, z, s) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 9), mossMat.clone());
    m.material.color.offsetHSL(rr(-0.03, 0.03), rr(-0.1, 0.1), rr(-0.08, 0.08));
    m.scale.set(s, s * rr(0.3, 0.5), s * rr(0.7, 1.2)); m.position.set(x, 0, z); m.rotation.y = rnd() * 6.28;
    m.receiveShadow = true; m.castShadow = true; scene.add(m);
  };
  const grassMat = new THREE.MeshLambertMaterial({ map: grassTex, alphaTest: 0.5, side: THREE.DoubleSide });
  const grassGeo = new THREE.PlaneGeometry(1, 1); grassGeo.translate(0, 0.5, 0);
  const makeTuft = (x, z, s) => {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rnd() * 6.28;
    for (let i = 0; i < 2; i++) { const m = new THREE.Mesh(grassGeo, grassMat); m.rotation.y = i * Math.PI / 2; m.scale.set(s * 1.2, s, 1); m.castShadow = true; g.add(m); }
    scene.add(g);
  };

  // boulders first, so plants can avoid them
  const boulders = [];
  for (let i = 0, tries = 0; i < 13 && tries < 400; tries++) {
    const a = rnd() * Math.PI * 2, d = rr(3, 12.2), x = Math.sin(a) * d, z = Math.cos(a) * d, r = rr(0.7, 2.1);
    if (nearFlower(x, z, 2.6 + r) || d2(x, z, start.x, start.z) < 3.5 + r || nearDoor(x, z) || d2(x, z, crack.x, crack.z) < 3.2 + r) continue;
    if (boulders.some((b) => d2(x, z, b.x, b.z) < b.r + r + 0.8)) continue;
    boulders.push({ x, z, r }); makeBoulder(x, z, r); i++;
  }
  const ferns = [];
  for (let i = 0, tries = 0; i < 26 && tries < 600; tries++) {

    }
    if (glow > 0) updateMotes(dt);

    renderer.render(scene, camera);
  });
}
</script>
